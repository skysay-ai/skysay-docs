<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="t d"><title id="t">An outbound call through a phone menu</title><desc id="d">Your agent answers the phone menu, waits on hold, checks that a person has answered, then starts the conversation. A menu with no matching option or the menu time limit ends the call; so does the hold limit.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#37c9d8"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8492a8"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="371" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="20" y="40" width="450" height="140" rx="12" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="58.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#8492a8" text-anchor="start">The company you called</text>
<rect x="36" y="72" width="196" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="134.0" y="97.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Phone menu</text>
<text x="134.0" y="118.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">Presses the key that fits,</text>
<text x="134.0" y="135.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">or says the answer</text>
<rect x="264" y="72" width="196" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="362.0" y="97.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Hold queue</text>
<text x="362.0" y="118.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">Waits quietly and declines</text>
<text x="362.0" y="135.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">callback offers</text>
<rect x="504" y="72" width="196" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="602.0" y="97.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Person check</text>
<text x="602.0" y="118.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">A short question confirms</text>
<text x="602.0" y="135.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">a person is there</text>
<rect x="740" y="72" width="196" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="838.0" y="97.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Conversation</text>
<text x="838.0" y="118.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">Your agent starts talking</text>
<text x="838.0" y="135.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8ca5b2" text-anchor="middle">with the person</text>
<path d="M232.0 112.0 L262.0 112.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M460.0 112.0 L502.0 112.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M700.0 112.0 L738.0 112.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M86.0 152.0 L86.0 236.0" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<text x="94.0" y="207.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ff6b6b" text-anchor="start">no option fits</text>
<path d="M206.0 152.0 L206.0 236.0" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<text x="214.0" y="222.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ff6b6b" text-anchor="start">after 3 min</text>
<path d="M362.0 152.0 L362.0 236.0" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<text x="370.0" y="207.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ff6b6b" text-anchor="start">after 10 min</text>
<rect x="30.0" y="238" width="115.6" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.3"/>
<text x="87.8" y="257.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff6b6b" text-anchor="middle">No menu match</text>
<rect x="150.0" y="238" width="129.4" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.3"/>
<text x="214.7" y="257.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff6b6b" text-anchor="middle">Menu time limit</text>
<rect x="314.6" y="238" width="94.9" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.3"/>
<text x="362.0" y="257.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff6b6b" text-anchor="middle">Hold limit</text>
<text x="30.0" y="290.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8492a8" text-anchor="start">Dead ends: not redialled</text>
<text x="362.0" y="290.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#8492a8" text-anchor="middle">A campaign retries it</text>
<line x1="24" y1="304" x2="936" y2="304" stroke="#1e2a3d" stroke-width="1"/>
<text x="24.0" y="330.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">On outbound calls your agent answers each phone menu, waits quietly on hold, and checks that a person has picked up before it</text>
<text x="24.0" y="350.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">starts talking. Menu time and hold time have separate limits (3 and 10 minutes by default), and the whole call ends at 29 minutes.</text>
</svg>
