<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="You choose Starter or Professional on Billing, Starter also yearly, and pay on Stripe's page in US dollars. Your plan starts when Stripe confirms the payment; Billing says activating until then. Each paid period renews the plan and the allowance resets every month, also on a yearly plan. If a payment fails, Stripe tries again and your plan stays; if every attempt fails, your workspace moves to pay as you go. If you cancel, the plan stays until the end of the paid period." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>You choose Starter or Professional on Billing, Starter also yearly, and pay on Stripe's page in US dollars. Your plan starts when Stripe confirms the payment; Billing says activating until then. Each paid period renews the plan and the allowance resets every month, also on a yearly plan. If a payment fails, Stripe tries again and your plan stays; if every attempt fails, your workspace moves to pay as you go. If you cancel, the plan stays until the end of the paid period.</title>
<defs><marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="379" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="28" y="50" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="128.0" y="77" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Choose on Billing</text>
<text x="128.0" y="97" font-size="14" fill="#8ca5b2" text-anchor="middle">Starter or Professional</text>
<text x="128.0" y="116" font-size="14" fill="#8ca5b2" text-anchor="middle">Starter also yearly</text>
<circle cx="128.0" cy="50" r="12" fill="#37c9d8"/>
<text x="128.0" y="55" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">1</text>
<rect x="256" y="50" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="356.0" y="77" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Pay on Stripe</text>
<text x="356.0" y="97" font-size="14" fill="#8ca5b2" text-anchor="middle">card and billing details,</text>
<text x="356.0" y="116" font-size="14" fill="#8ca5b2" text-anchor="middle">in US dollars</text>
<circle cx="356.0" cy="50" r="12" fill="#37c9d8"/>
<text x="356.0" y="55" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">2</text>
<rect x="484" y="50" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="584.0" y="77" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Plan starts</text>
<text x="584.0" y="97" font-size="14" fill="#8ca5b2" text-anchor="middle">when Stripe confirms;</text>
<text x="584.0" y="116" font-size="14" fill="#8ca5b2" text-anchor="middle">activating until then</text>
<circle cx="584.0" cy="50" r="12" fill="#37c9d8"/>
<text x="584.0" y="55" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">3</text>
<rect x="712" y="50" width="220" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="822.0" y="77" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Renews</text>
<text x="822.0" y="97" font-size="14" fill="#8ca5b2" text-anchor="middle">every paid period; the</text>
<text x="822.0" y="116" font-size="14" fill="#8ca5b2" text-anchor="middle">allowance resets monthly</text>
<circle cx="822.0" cy="50" r="12" fill="#37c9d8"/>
<text x="822.0" y="55" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">4</text>
<path d="M228,92 L254,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M456,92 L482,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M684,92 L710,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M740,134 L740,196" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<text x="740" y="216" font-size="14" fill="#8ca5b2" text-anchor="middle">payment failed: Stripe</text>
<text x="740" y="235" font-size="14" fill="#8ca5b2" text-anchor="middle">tries again, plan stays</text>
<rect x="650" y="250" width="180" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="740" y="270" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">all fail: pay as you go</text>
<path d="M890,134 L890,196" fill="none" stroke="#8492a8" stroke-width="2" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="890" y="216" font-size="14" fill="#8ca5b2" text-anchor="middle">you cancel:</text>
<text x="890" y="235" font-size="14" fill="#8ca5b2" text-anchor="middle">plan stays</text>
<rect x="838" y="250" width="110" height="30" rx="15" fill="#12302a" stroke="#5ad6a0" stroke-width="1.5"/>
<text x="893" y="270" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">to period end</text>
<text x="480" y="330" font-size="14" fill="#8ca5b2" text-anchor="middle">A plan starts only when Stripe confirms the payment, renews each paid period, and ends after Stripe</text>
<text x="480" y="350" font-size="14" fill="#8ca5b2" text-anchor="middle">gives up on a payment or at the end of a cancelled period. It never adds money to your balance.</text>
</svg>
