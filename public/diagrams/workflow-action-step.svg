<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ff6b6b"/></marker><marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#ff6b6b"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#37c9d8"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#37c9d8"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8492a8"/></marker><marker id="ass" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#8492a8"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="454.5" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="24" y="120" width="172" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="110.0" y="150.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Action step</text>
<text x="110.0" y="167.5" font-size="14" fill="#8ca5b2" text-anchor="middle">prepares one write:</text>
<text x="110.0" y="185.0" font-size="14" fill="#8ca5b2" text-anchor="middle">SMS, transfer, booking</text>
<rect x="224" y="120" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="324.0" y="150.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Reads it back</text>
<text x="324.0" y="167.5" font-size="14" fill="#8ca5b2" text-anchor="middle">“I&#x27;ll connect you to</text>
<text x="324.0" y="185.0" font-size="14" fill="#8ca5b2" text-anchor="middle">reception. Shall I go ahead?”</text>
<rect x="452" y="120" width="140" height="84" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="522.0" y="167.5" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Caller answers</text>
<path d="M196,162 L222,162" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M424,162 L450,162" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M522,204 L522,236 L324,236 L324,206" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#as)"/>
<rect x="338" y="225.5" width="170" height="17.5" rx="4" fill="#141d2c"/>
<text x="423" y="238" font-size="14" fill="#8492a8" text-anchor="middle">unclear: asks once more</text>
<rect x="632" y="40" width="140" height="70" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="702.0" y="71.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Does it</text>
<text x="702.0" y="89.25" font-size="14" fill="#8ca5b2" text-anchor="middle">waits for its result</text>
<path d="M592,150 L612,150 L612,75 L630,75" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="608" y="100" font-size="14" fill="#5ad6a0" font-weight="600" text-anchor="end">yes</text>
<rect x="800" y="24" width="136" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="868.0" y="43.5" font-size="14" fill="#5ad6a0" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">next</text>
<rect x="800" y="62" width="136" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="868.0" y="81.5" font-size="14" fill="#ff6b6b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">on_error</text>
<rect x="800" y="100" width="136" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="868.0" y="119.5" font-size="14" fill="#ff6b6b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">on_unknown</text>
<path d="M772,75 L786,75" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M786,39 L786,115" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M786,39 L798,39" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M786,77 L798,77" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<path d="M786,115 L798,115" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<text x="868" y="150" font-size="14" fill="#ff6b6b" text-anchor="middle">unknown: never claim</text>
<text x="868" y="165" font-size="14" fill="#ff6b6b" text-anchor="middle">that it worked</text>
<rect x="660" y="196" width="140" height="30" rx="15.0" fill="#1a2536" stroke="#5b6b84" stroke-width="1.5"/>
<text x="730.0" y="215.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">on_declined</text>
<rect x="660" y="240" width="140" height="30" rx="15.0" fill="#1a2536" stroke="#5b6b84" stroke-width="1.5"/>
<text x="730.0" y="259.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">on_change</text>
<path d="M592,176 L606,176 L606,211 L658,211" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<path d="M606,211 L606,255 L658,255" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="632" y="207" font-size="14" fill="#8492a8" text-anchor="middle">no</text>
<text x="632" y="251" font-size="14" fill="#8492a8" text-anchor="middle">change</text>
<text x="810" y="217" font-size="14" fill="#8492a8">nothing is done</text>
<text x="810" y="261" font-size="14" fill="#8492a8">a new read-back</text>
<rect x="24" y="296" width="912" height="70" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="480.0" y="318.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Nothing is written before the caller&#x27;s explicit yes to the read-back</text>
<text x="480.0" y="336.0" font-size="14" fill="#8ca5b2" text-anchor="middle">an answered transfer ends the workflow as transferred instead of taking next</text>
<text x="480.0" y="353.5" font-size="14" fill="#8ca5b2" text-anchor="middle">a busy or unanswered transfer takes on_error · an SMS timeout takes on_unknown and is never resent</text>
<text x="28" y="404" font-size="14" fill="#8ca5b2">Every write a workflow makes goes through one Action step: Skysay reads it back, waits for a yes, does it, and</text>
<text x="28" y="424" font-size="14" fill="#8ca5b2">follows the route its result names. Connect all five routes.</text>
</svg>
