<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300" role="img" aria-labelledby="title desc">
  <title id="title">Close CRM calls with Skysay</title>
  <desc id="desc">Choose a Close contact in Skysay, confirm an AI call, then send its real outcome and summary to the original lead.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#37c9d8" stroke-width="1.5"/></marker></defs>
  <rect x="1" y="1" width="1238" height="298" rx="12" fill="#141d2c" stroke="#243049"/>
  <g font-family="Geist Variable, sans-serif" fill="#dbe4f0">
    <text x="28" y="35" font-size="18" font-weight="600">Your CRM contact, your AI agent, one call history</text>
    <rect x="28" y="70" width="240" height="124" rx="12" fill="#1a2536" stroke="#2c3a52"/>
    <text x="48" y="100" font-size="16" font-weight="600">Close contacts</text>
    <text x="48" y="130" font-size="14" fill="#8ca5b2">Connected organization</text>
    <text x="48" y="155" font-size="14" fill="#8ca5b2">Original lead and phone</text>
    <rect x="340" y="70" width="240" height="124" rx="12" fill="#14262b" stroke="#37c9d8"/>
    <text x="360" y="100" font-size="16" font-weight="600">Choose in Skysay</text>
    <text x="360" y="130" font-size="14" fill="#8ca5b2">Confirm the exact contact</text>
    <text x="360" y="155" font-size="14" fill="#8ca5b2">Normal calling safeguards</text>
    <rect x="652" y="70" width="240" height="124" rx="12" fill="#14262b" stroke="#37c9d8"/>
    <text x="672" y="100" font-size="16" font-weight="600">AI phone call</text>
    <text x="672" y="130" font-size="14" fill="#8ca5b2">Your voice and instructions</text>
    <text x="672" y="155" font-size="14" fill="#8ca5b2">Wait for the real outcome</text>
    <rect x="964" y="70" width="248" height="124" rx="12" fill="#1a2536" stroke="#2c3a52"/>
    <text x="984" y="100" font-size="16" font-weight="600">Close call activity</text>
    <text x="984" y="130" font-size="14" fill="#8ca5b2">Outcome and AI summary</text>
    <text x="984" y="155" font-size="14" fill="#8ca5b2">Secure Skysay evidence link</text>
    <text x="28" y="240" font-size="14" fill="#8ca5b2">An accepted call request is not a connected call. Unconfirmed deliveries are not automatically repeated.</text>
    <text x="28" y="267" font-size="14" fill="#8ca5b2">Existing finished inbound and outbound calls can also be linked when their phone matches the CRM contact.</text>
  </g>
  <g fill="none" stroke="#37c9d8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M280 132H326"/><path d="M592 132H638"/><path d="M904 132H950"/>
  </g>
</svg>
