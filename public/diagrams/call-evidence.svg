<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="A call (phone call, browser test or homepage demo) has a call record with its status, recording state and where its workflow ended, and an event log, both read with calls:read. Its recording (listening mix, waveform peaks, disclosure state), transcript turns and AI summary need recordings:read; in the workspace, Calls plays the recording and shows the transcript with each tool call and language switch. A completed call can have no recording or transcript, so check its recording state first." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>A call (phone call, browser test or homepage demo) has a call record with its status, recording state and where its workflow ended, and an event log, both read with calls:read. Its recording (listening mix, waveform peaks, disclosure state), transcript turns and AI summary need recordings:read; in the workspace, Calls plays the recording and shows the transcript with each tool call and language switch. A completed call can have no recording or transcript, so check its recording state first.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="429" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="132" width="180" height="90" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="122.0" y="162.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">A call</text>
<text x="122.0" y="182.0" font-size="14" fill="#8ca5b2" text-anchor="middle">phone call, browser</text>
<text x="122.0" y="201.0" font-size="14" fill="#8ca5b2" text-anchor="middle">test or homepage demo</text>
<rect x="250" y="26" width="678" height="132" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="264.0" y="46.0" font-size="14" fill="#8492a8" text-anchor="start">Needs calls:read</text>
<rect x="270" y="60" width="310" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="425.0" y="85.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Call record</text>
<text x="425.0" y="105.0" font-size="14" fill="#8ca5b2" text-anchor="middle">status, recording state,</text>
<text x="425.0" y="124.0" font-size="14" fill="#8ca5b2" text-anchor="middle">where its workflow ended</text>
<rect x="598" y="60" width="310" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="753.0" y="85.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Event log</text>
<text x="753.0" y="105.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the call's own events,</text>
<text x="753.0" y="124.0" font-size="14" fill="#8ca5b2" text-anchor="middle">oldest first</text>
<rect x="250" y="180" width="678" height="132" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="264.0" y="200.0" font-size="14" fill="#8492a8" text-anchor="start">Needs recordings:read</text>
<rect x="270" y="214" width="200" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="370.0" y="239.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Recording</text>
<text x="370.0" y="259.0" font-size="14" fill="#8ca5b2" text-anchor="middle">listening mix, waveform</text>
<text x="370.0" y="278.0" font-size="14" fill="#8ca5b2" text-anchor="middle">peaks, disclosure state</text>
<rect x="489" y="214" width="200" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="589.0" y="239.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Transcript</text>
<text x="589.0" y="259.0" font-size="14" fill="#8ca5b2" text-anchor="middle">speaker-attributed</text>
<text x="589.0" y="278.0" font-size="14" fill="#8ca5b2" text-anchor="middle">turns of the call</text>
<rect x="708" y="214" width="200" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="808.0" y="239.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Summary</text>
<text x="808.0" y="259.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the AI summary,</text>
<text x="808.0" y="278.0" font-size="14" fill="#8ca5b2" text-anchor="middle">when one was made</text>
<path d="M212,177 L230,177 L230,92 L248,92" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<path d="M212,177 L230,177 L230,246 L248,246" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="480.0" y="340.0" font-size="14" fill="#8492a8" text-anchor="middle">A completed call can have no recording or transcript: check its recording state before you expect audio.</text>
<text x="480.0" y="388.0" font-size="14" fill="#8ca5b2" text-anchor="middle">In the workspace, Calls plays the recording and shows the transcript with each tool call and language switch.</text>
<text x="480.0" y="408.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Over the API and MCP, recordings, transcripts and summaries need recordings:read, separate from calls:read.</text>
</svg>
