<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="A phone server test call: you enter an extension in Settings and select Test call; Skysay calls it showing your Skysay number and says nothing before answer; when answered within 40 seconds, Skysay says a six-digit code twice and hangs up; you enter it in Settings within 5 minutes with at most three wrong tries. A match makes the server verified; unanswered, ended early, three wrong codes or 5 minutes passed leave it not verified." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>A phone server test call: you enter an extension in Settings and select Test call; Skysay calls it showing your Skysay number; when answered, Skysay says a six-digit code twice; you enter it in Settings within 5 minutes to verify the server</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="24" y="48" width="194" height="114" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="121" y="78" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">You, in Settings</text>
<text x="121" y="102" font-size="14" fill="#8ca5b2" text-anchor="middle">enter extension 204,</text>
<text x="121" y="121" font-size="14" fill="#8ca5b2" text-anchor="middle">select Test call</text>
<text x="121" y="140" font-size="14" fill="#8ca5b2" text-anchor="middle">(no code is shown)</text>
<rect x="248" y="48" width="214" height="114" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="355" y="78" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay calls</text>
<text x="355" y="102" font-size="14" fill="#8ca5b2" text-anchor="middle">204 on your phone system,</text>
<text x="355" y="121" font-size="14" fill="#8ca5b2" text-anchor="middle">shows your Skysay number,</text>
<text x="355" y="140" font-size="14" fill="#8ca5b2" text-anchor="middle">says nothing before answer</text>
<rect x="492" y="48" width="206" height="114" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="595" y="78" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your phone rings</text>
<text x="595" y="102" font-size="14" fill="#8ca5b2" text-anchor="middle">up to 40 s; you answer;</text>
<text x="595" y="121" font-size="14" fill="#8ca5b2" text-anchor="middle">Skysay says a 6-digit</text>
<text x="595" y="140" font-size="14" fill="#8ca5b2" text-anchor="middle">code twice, hangs up</text>
<rect x="728" y="48" width="208" height="114" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="832" y="78" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Enter code in Settings</text>
<text x="832" y="102" font-size="14" fill="#8ca5b2" text-anchor="middle">within 5 minutes;</text>
<text x="832" y="121" font-size="14" fill="#8ca5b2" text-anchor="middle">at most 3 wrong tries;</text>
<text x="832" y="140" font-size="14" fill="#8ca5b2" text-anchor="middle">Skysay checks it</text>
<path d="M218,105 L246,105" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<path d="M462,105 L490,105" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<path d="M698,105 L726,105" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<path d="M310,162 L310,186 L222,186 L222,208" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="130" y="210" width="184" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="222" y="229.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Not answered</text>
<text x="222" y="260" font-size="14" fill="#8ca5b2" text-anchor="middle">refused, busy or 40 s</text>
<text x="222" y="278" font-size="14" fill="#8ca5b2" text-anchor="middle">not verified</text>
<path d="M545,162 L545,186 L426,186 L426,208" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="334" y="210" width="184" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="426" y="229.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Ended early</text>
<text x="426" y="260" font-size="14" fill="#8ca5b2" text-anchor="middle">hung up before code</text>
<text x="426" y="278" font-size="14" fill="#8ca5b2" text-anchor="middle">finished · not verified</text>
<path d="M766,162 L766,186 L644,186 L644,208" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="538" y="210" width="212" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="644" y="229.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Wrong or expired</text>
<text x="644" y="260" font-size="14" fill="#8ca5b2" text-anchor="middle">3 wrong codes or 5 min</text>
<text x="644" y="278" font-size="14" fill="#8ca5b2" text-anchor="middle">passed · not verified</text>
<path d="M853,162 L853,208" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<rect x="770" y="210" width="166" height="30" rx="15" fill="#12302a" stroke="#5ad6a0" stroke-width="1.5"/>
<text x="853" y="229.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Match: verified</text>
<text x="853" y="260" font-size="14" fill="#8ca5b2" text-anchor="middle">server reads Verified</text>
<text x="480" y="346" font-size="14" fill="#dbe4f0" text-anchor="middle">The workspace never shows the code; only the code spoken on Skysay's call verifies the server.</text>
<text x="480" y="368" font-size="14" fill="#8ca5b2" text-anchor="middle">Verified means the call reached that phone system; Skysay does not send a number's calls there yet.</text>
</svg>
