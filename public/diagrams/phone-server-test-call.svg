<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="A phone server test call: you name an extension, Skysay shows a code once and calls that extension on your phone system, the person who answers types the code, and only a match makes the server verified" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>A phone server test call: you name an extension, Skysay shows a code once and calls that extension on your phone system, the person who answers types the code, and only a match makes the server verified</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="56" width="180" height="108" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="122" y="86" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">You, in Settings</text>
<text x="122" y="108" font-size="14" fill="#8ca5b2" text-anchor="middle">enter extension 204,</text>
<text x="122" y="126" font-size="14" fill="#8ca5b2" text-anchor="middle">select Test call,</text>
<text x="122" y="144" font-size="14" fill="#8ca5b2" text-anchor="middle">see the code once</text>
<rect x="250" y="56" width="200" height="108" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="350" y="86" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay calls</text>
<text x="350" y="108" font-size="14" fill="#8ca5b2" text-anchor="middle">204 at your phone system,</text>
<text x="350" y="126" font-size="14" fill="#8ca5b2" text-anchor="middle">shows your Skysay number,</text>
<text x="350" y="144" font-size="14" fill="#8ca5b2" text-anchor="middle">plays nothing</text>
<rect x="488" y="56" width="190" height="108" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="583" y="86" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your desk phone</text>
<text x="583" y="108" font-size="14" fill="#8ca5b2" text-anchor="middle">rings up to 40 s;</text>
<text x="583" y="126" font-size="14" fill="#8ca5b2" text-anchor="middle">you answer and type</text>
<text x="583" y="144" font-size="14" fill="#8ca5b2" text-anchor="middle">the eight digits</text>
<rect x="716" y="56" width="212" height="108" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="822" y="86" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay listens</text>
<text x="822" y="108" font-size="14" fill="#8ca5b2" text-anchor="middle">on that call only and</text>
<text x="822" y="126" font-size="14" fill="#8ca5b2" text-anchor="middle">compares the digits</text>
<text x="822" y="144" font-size="14" fill="#8ca5b2" text-anchor="middle">with the code</text>
<path d="M212,110 L248,110" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<path d="M450,110 L486,110" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<path d="M678,110 L714,110" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<path d="M822,164 L822,206" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<rect x="708" y="208" width="228" height="30" rx="15" fill="#12302a" stroke="#5ad6a0" stroke-width="1.5"/>
<text x="822" y="227.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Match: verified</text>
<path d="M583,164 L583,206" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="440" y="208" width="250" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="565" y="227.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">No code heard: not verified</text>
<text x="565" y="262" font-size="14" fill="#8ca5b2" text-anchor="middle">a menu or voicemail answered,</text>
<text x="565" y="280" font-size="14" fill="#8ca5b2" text-anchor="middle">or nobody typed the code</text>
<path d="M350,164 L350,206" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="232" y="208" width="196" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="330" y="227.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Not put through</text>
<text x="330" y="262" font-size="14" fill="#8ca5b2" text-anchor="middle">refused, busy or no answer</text>
<text x="480" y="352" font-size="14" fill="#dbe4f0" text-anchor="middle">Only a code that arrives on Skysay's own test call makes the server verified.</text>
<text x="480" y="372" font-size="14" fill="#8ca5b2" text-anchor="middle">Verified means the connection works; Skysay does not send a number's calls to a phone server yet.</text>
</svg>
