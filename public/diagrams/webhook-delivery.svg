<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="A call or SMS event in the project is sent by Skysay as an HTTPS POST signed with your webhook secret. Your endpoint checks the signature and answers 2xx within 10 seconds; otherwise the same event is sent again after 1 minute, 5 minutes, 30 minutes, 2 hours and 8 hours, six tries in all. After 5 deliveries in a row use all six tries, the endpoint becomes auto_disabled until you resume it. Delivery is at least once and can arrive out of order." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>A call or SMS event in the project is sent by Skysay as an HTTPS POST signed with your webhook secret. Your endpoint checks the signature and answers 2xx within 10 seconds; otherwise the same event is sent again after 1 minute, 5 minutes, 30 minutes, 2 hours and 8 hours, six tries in all. After 5 deliveries in a row use all six tries, the endpoint becomes auto_disabled until you resume it. Delivery is at least once and can arrive out of order.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="419" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="46" width="200" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="132.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">A call or SMS event</text>
<text x="132.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">any subscribed event</text>
<text x="132.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">in the project</text>
<rect x="272" y="46" width="210" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="377.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay signs it</text>
<text x="377.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">an HTTPS POST, signed</text>
<text x="377.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">with your webhook secret</text>
<rect x="522" y="46" width="210" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="627.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your endpoint</text>
<text x="627.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">checks the signature,</text>
<text x="627.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">answers 2xx within 10 s</text>
<path d="M232,86 L270,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M482,86 L520,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M732,86 L788,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="790.0" y="71.0" width="132" height="30" rx="15.0" fill="#12302a" stroke="#37c9d8" stroke-width="1.5"/>
<text x="856.0" y="91.0" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Delivered</text>
<path d="M627,126 L627,224" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<text x="640.0" y="181.0" font-size="14" fill="#ff6b6b" text-anchor="start">no 2xx in 10 s</text>
<rect x="512" y="226" width="230" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="627.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Sent again later</text>
<text x="627.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">after 1 min, 5 min, 30 min,</text>
<text x="627.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">2 h and 8 h: six tries in all</text>
<path d="M512,266 L377,266 L377,128" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="386.0" y="256.0" font-size="14" fill="#8492a8" text-anchor="start">same event</text>
<path d="M742,266 L774,266" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="776.0" y="251.0" width="160" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="856.0" y="271.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">auto_disabled</text>
<text x="856.0" y="302.0" font-size="14" fill="#8ca5b2" text-anchor="middle">after 5 deliveries in a row</text>
<text x="856.0" y="321.0" font-size="14" fill="#8ca5b2" text-anchor="middle">use all six tries, until</text>
<text x="856.0" y="340.0" font-size="14" fill="#8ca5b2" text-anchor="middle">you resume the endpoint</text>
<text x="480.0" y="378.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Each event is a signed POST: check the signature on the raw body and answer quickly.</text>
<text x="480.0" y="398.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Delivery is at least once and can arrive out of order, so keep each event's id and ignore repeats.</text>
</svg>
