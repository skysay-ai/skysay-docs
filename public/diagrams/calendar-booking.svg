<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="afs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="479" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="32" y="56" width="260" height="84" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="162.0" y="86.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Agent checks times</text>
<text x="162.0" y="105.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">up to 5 offers, each</text>
<text x="162.0" y="122.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">held for 3 minutes</text>
<circle cx="162.0" cy="56" r="12" fill="#3f7a5e"/>
<text x="162.0" y="60.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="342" y="56" width="260" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="472.0" y="86.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Caller picks a time</text>
<text x="472.0" y="105.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">agent collects the name</text>
<text x="472.0" y="122.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">and any required email</text>
<circle cx="472.0" cy="56" r="12" fill="#3f7a5e"/>
<text x="472.0" y="60.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="652" y="56" width="260" height="84" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="782.0" y="86.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Agent reads it back</text>
<text x="782.0" y="105.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">nothing is booked yet;</text>
<text x="782.0" y="122.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">one yes-or-no question</text>
<circle cx="782.0" cy="56" r="12" fill="#3f7a5e"/>
<text x="782.0" y="60.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="32" y="236" width="260" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="162.0" y="266.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Caller says yes</text>
<text x="162.0" y="285.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">a later, explicit</text>
<text x="162.0" y="302.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">unconditional yes</text>
<circle cx="162.0" cy="236" r="12" fill="#3f7a5e"/>
<text x="162.0" y="240.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<rect x="342" y="236" width="260" height="84" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="472.0" y="266.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Skysay checks again</text>
<text x="472.0" y="285.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">offer still valid, then it</text>
<text x="472.0" y="302.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">records the booking intent</text>
<circle cx="472.0" cy="236" r="12" fill="#3f7a5e"/>
<text x="472.0" y="240.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<rect x="652" y="236" width="260" height="84" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="782.0" y="266.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Calendar answers</text>
<text x="782.0" y="285.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">booked only when the</text>
<text x="782.0" y="302.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">result says it is booked</text>
<circle cx="782.0" cy="236" r="12" fill="#3f7a5e"/>
<text x="782.0" y="240.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<polyline points="292,98 340,98" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="292,278 340,278" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="602,98 650,98" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="602,278 650,278" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="782,140 782,186 162,186 162,222" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="162,320 162,352" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="44" y="352" width="236" height="34" rx="17.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.4"/>
<text x="162.0" y="373.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">No or silence: never books</text>
<polyline points="472,320 472,352" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="352" y="352" width="240" height="34" rx="17.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.4"/>
<text x="472.0" y="373.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">Expired or taken: unavailable</text>
<polyline points="700,320 700,350" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="652" y="352" width="96" height="34" rx="17.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.4"/>
<text x="700.0" y="373.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#2f6b4f" font-weight="600" text-anchor="middle">Booked</text>
<polyline points="842,320 842,352" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="772" y="352" width="140" height="34" rx="17.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.4"/>
<text x="842.0" y="373.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">Unconfirmed</text>
<text x="480.0" y="424" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">Nothing is booked until the caller says a later, explicit yes to the exact details read back. Skysay checks</text>
<text x="480.0" y="444" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">the offer again and reports a booking only when the calendar confirms it; an uncertain result is never re-sent.</text>
</svg>
