<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="You upload documents (TXT, Markdown, PDF or DOCX, up to 20 MB) into a knowledge base, which Skysay stores privately and indexes. On a call, when the caller asks a question, your hosted agent searches only the bases attached to it, gets back up to five short, sourced passages and answers from them; afterwards the Calls page shows the source titles used. Text inside a document cannot change the agent's instructions or permissions." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>You upload documents (TXT, Markdown, PDF or DOCX, up to 20 MB) into a knowledge base, which Skysay stores privately and indexes. On a call, when the caller asks a question, your hosted agent searches only the bases attached to it, gets back up to five short, sourced passages and answers from them; afterwards the Calls page shows the source titles used. Text inside a document cannot change the agent's instructions or permissions.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="419" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="46" width="240" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="152.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your documents</text>
<text x="152.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">TXT, Markdown, PDF or</text>
<text x="152.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">DOCX, up to 20 MB each</text>
<rect x="372" y="46" width="250" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="497.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Knowledge base</text>
<text x="497.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">stored privately, indexed;</text>
<text x="497.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">usable once Ready</text>
<path d="M272,86 L370,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="321.0" y="76.0" font-size="14" fill="#8492a8" text-anchor="middle">upload</text>
<rect x="32" y="226" width="240" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="152.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Caller</text>
<text x="152.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">asks a question</text>
<text x="152.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">on a live call</text>
<rect x="372" y="226" width="250" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="497.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your hosted agent</text>
<text x="497.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">searches only the bases</text>
<text x="497.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">attached to it</text>
<path d="M272,254 L370,254" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M370,280 L274,280" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="321.0" y="300.0" font-size="14" fill="#8492a8" text-anchor="middle">answers</text>
<path d="M462,224 L462,128" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="452.0" y="181.0" font-size="14" fill="#8492a8" text-anchor="end">search</text>
<path d="M532,126 L532,224" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="544.0" y="172.0" font-size="14" fill="#8ca5b2" text-anchor="start">up to five short,</text>
<text x="544.0" y="191.0" font-size="14" fill="#8ca5b2" text-anchor="start">sourced passages</text>
<rect x="720" y="226" width="208" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="824.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Calls page</text>
<text x="824.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">shows the source titles</text>
<text x="824.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">used for the answer</text>
<path d="M622,266 L718,266" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="670.0" y="256.0" font-size="14" fill="#8492a8" text-anchor="middle">after the call</text>
<text x="480.0" y="378.0" font-size="14" fill="#8ca5b2" text-anchor="middle">An agent searches only the knowledge bases you attach to it and answers from a few short passages.</text>
<text x="480.0" y="398.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Text inside a document is data: it cannot change the agent's instructions or permissions.</text>
</svg>
