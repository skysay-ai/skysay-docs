<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="t d"><title id="t">Which failure label a call gets</title><desc id="d">Three questions in order. If the call never became a conversation it is a telephony failure; if Skysay's voice pipeline broke it is an audio and media failure; if the agent or your systems failed it is an AI agent behaviour failure; otherwise no failure was observed.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3f7a5e"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="371" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="28" y="56" width="202" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="129.0" y="91.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Did the call become a</text>
<text x="129.0" y="110.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">conversation?</text>
<path d="M129.0 136.0 L129.0 190.0" fill="none" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<text x="137.0" y="165.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">No</text>
<rect x="85.0" y="192" width="88.0" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.3"/>
<text x="129.0" y="211.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">Telephony</text>
<text x="129.0" y="244.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">You act: check the contact</text>
<text x="129.0" y="260.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">list, the calling times or the</text>
<text x="129.0" y="277.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">number</text>
<path d="M230.0 96.0 L268.0 96.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<text x="250.0" y="88.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">Yes</text>
<rect x="270" y="56" width="202" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="371.0" y="91.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Did Skysay's voice</text>
<text x="371.0" y="110.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">pipeline hold up?</text>
<path d="M371.0 136.0 L371.0 190.0" fill="none" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<text x="379.0" y="165.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">No</text>
<rect x="306.3" y="192" width="129.4" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.3"/>
<text x="371.0" y="211.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">Audio and media</text>
<text x="371.0" y="244.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Skysay acts: the failure is</text>
<text x="371.0" y="260.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">ours</text>
<path d="M472.0 96.0 L510.0 96.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<text x="492.0" y="88.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">Yes</text>
<rect x="512" y="56" width="202" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="613.0" y="91.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Did the agent and</text>
<text x="613.0" y="110.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">your systems work?</text>
<path d="M613.0 136.0 L613.0 190.0" fill="none" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<text x="621.0" y="165.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">No</text>
<rect x="538.0" y="192" width="150.0" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.3"/>
<text x="613.0" y="211.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">AI agent behaviour</text>
<text x="613.0" y="244.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">You act: check the prompt,</text>
<text x="613.0" y="260.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">your webhook or tool, or the</text>
<text x="613.0" y="277.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">transfer number</text>
<path d="M714.0 96.0 L752.0 96.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<text x="733.0" y="88.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">Yes</text>
<rect x="754.0" y="81.0" width="156.9" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="832.5" y="100.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">No failure observed</text>
<text x="754.0" y="134.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Not proof the call went</text>
<text x="754.0" y="150.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">well</text>
<line x1="24" y1="304" x2="936" y2="304" stroke="#eef0f3" stroke-width="1"/>
<text x="24.0" y="330.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">A finished call carries at most one failure label, for its root cause: the first question answered No decides it. Any other</text>
<text x="24.0" y="350.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">problems seen on the call stay visible in its drawer.</text>
</svg>
