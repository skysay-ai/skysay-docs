<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="When a call is answered, Skysay listens to the far end's audio and classifies it as human (a person spoke, then paused), silent, unknown, or non_human_audio (unbroken music or tones, or a recording repeating itself). What the agent does with non_human_audio is its Answer detection setting: shadow, the default, records the verdict and changes nothing; end_call makes the agent go quiet and ends the call, never while the agent is navigating a phone menu or hold queue; off collects nothing." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>When a call is answered, Skysay listens to the far end's audio and classifies it as human (a person spoke, then paused), silent, unknown, or non_human_audio (unbroken music or tones, or a recording repeating itself). What the agent does with non_human_audio is its Answer detection setting: shadow, the default, records the verdict and changes nothing; end_call makes the agent go quiet and ends the call, never while the agent is navigating a phone menu or hold queue; off collects nothing.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="96" width="190" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="127.0" y="121.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The line answers</text>
<text x="127.0" y="141.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the carrier reports</text>
<text x="127.0" y="160.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the call answered</text>
<rect x="262" y="96" width="200" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="362.0" y="121.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay listens</text>
<text x="362.0" y="141.0" font-size="14" fill="#8ca5b2" text-anchor="middle">to the far end's sound</text>
<text x="362.0" y="160.0" font-size="14" fill="#8ca5b2" text-anchor="middle">and recognised words</text>
<path d="M222,136 L260,136" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M462,136 L486,136 L486,52 L508,52" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="510.0" y="37.0" width="170" height="30" rx="15.0" fill="#12302a" stroke="#37c9d8" stroke-width="1.5"/>
<text x="595.0" y="57.0" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">human</text>
<text x="694.0" y="57.0" font-size="14" fill="#8ca5b2" text-anchor="start">a person spoke, then paused</text>
<path d="M462,136 L486,136 L486,100 L508,100" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="510.0" y="85.0" width="170" height="30" rx="15.0" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="595.0" y="105.0" font-size="14" fill="#dbe4f0" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">silent</text>
<text x="694.0" y="105.0" font-size="14" fill="#8ca5b2" text-anchor="start">nothing at all was heard</text>
<path d="M462,136 L486,136 L486,148 L508,148" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="510.0" y="133.0" width="170" height="30" rx="15.0" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="595.0" y="153.0" font-size="14" fill="#dbe4f0" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">unknown</text>
<text x="694.0" y="153.0" font-size="14" fill="#8ca5b2" text-anchor="start">no conclusion in its window</text>
<path d="M462,136 L486,136 L486,196 L508,196" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="510.0" y="181.0" width="170" height="30" rx="15.0" fill="#1a2536" stroke="#f2b24c" stroke-width="1.5"/>
<text x="595.0" y="201.0" font-size="14" fill="#f2b24c" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">non_human_audio</text>
<text x="694.0" y="201.0" font-size="14" fill="#8ca5b2" text-anchor="start">music, tones, a looped recording</text>
<rect x="32" y="250" width="896" height="150" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="46.0" y="270.0" font-size="14" fill="#8492a8" text-anchor="start">What the agent does with non_human_audio: its Answer detection setting</text>
<path d="M595,211 L595,248" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="60" y="292" width="260" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="190.0" y="317.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">shadow (default)</text>
<text x="190.0" y="337.0" font-size="14" fill="#8ca5b2" text-anchor="middle">records the verdict,</text>
<text x="190.0" y="356.0" font-size="14" fill="#8ca5b2" text-anchor="middle">changes nothing on the call</text>
<rect x="350" y="292" width="260" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="480.0" y="317.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">end_call</text>
<text x="480.0" y="337.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the agent goes quiet,</text>
<text x="480.0" y="356.0" font-size="14" fill="#8ca5b2" text-anchor="middle">and the call is ended</text>
<rect x="640" y="292" width="260" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="770.0" y="317.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">off</text>
<text x="770.0" y="337.0" font-size="14" fill="#8ca5b2" text-anchor="middle">collects nothing: calls carry</text>
<text x="770.0" y="356.0" font-size="14" fill="#8ca5b2" text-anchor="middle">no classification</text>
<text x="480.0" y="428.0" font-size="14" fill="#8ca5b2" text-anchor="middle">"Answered" only says the line connected; the classification says what was heard after that.</text>
<text x="480.0" y="448.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Only an agent set to end_call acts on it, and never while the agent is navigating a phone menu or hold queue.</text>
</svg>
