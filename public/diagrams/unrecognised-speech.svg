<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398" role="img" aria-label="When a caller speaks and the transcriber returns no words, most often because they speak a language the agent is not listening for, the Standard agent waits until they stop and then says one line, composed in its own voice and language, that it could not understand and which languages it can help in, and keeps listening. It is never spoken when follow the caller is on, on GPT-Live 1 or Gemini Live, in a workflow, or while the agent is speaking; it is on by default, at most twice per call, and its wording and limit can be changed or it can be switched off." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>When a caller speaks and the transcriber returns no words, most often because they speak a language the agent is not listening for, the Standard agent waits until they stop and then says one line, composed in its own voice and language, that it could not understand and which languages it can help in, and keeps listening. It is never spoken when follow the caller is on, on GPT-Live 1 or Gemini Live, in a workflow, or while the agent is speaking; it is on by default, at most twice per call, and its wording and limit can be changed or it can be switched off.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="397" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="40" width="220" height="84" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="142.0" y="67.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The caller speaks</text>
<text x="142.0" y="87.0" font-size="14" fill="#8ca5b2" text-anchor="middle">often in a language the</text>
<text x="142.0" y="106.0" font-size="14" fill="#8ca5b2" text-anchor="middle">agent isn't listening for</text>
<rect x="290" y="40" width="220" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="400.0" y="67.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">No words come back</text>
<text x="400.0" y="87.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the transcriber returns</text>
<text x="400.0" y="106.0" font-size="14" fill="#8ca5b2" text-anchor="middle">nothing for the model</text>
<rect x="548" y="40" width="230" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="663.0" y="67.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The agent says one line</text>
<text x="663.0" y="87.0" font-size="14" fill="#8ca5b2" text-anchor="middle">after the caller stops and</text>
<text x="663.0" y="106.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the transcript wait ends</text>
<path d="M252,82 L288,82" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M510,82 L546,82" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M778,82 L790,82" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="792.0" y="67.0" width="140" height="30" rx="15.0" fill="#12302a" stroke="#37c9d8" stroke-width="1.5"/>
<text x="862.0" y="87.0" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Keeps listening</text>
<text x="480.0" y="168.0" font-size="14" fill="#8ca5b2" text-anchor="middle">The line is composed on the call in the agent's own voice and language, naming the languages it is set up for.</text>
<rect x="32" y="192" width="896" height="136" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="46.0" y="212.0" font-size="14" fill="#8492a8" text-anchor="start">Never spoken when</text>
<rect x="52" y="226" width="200" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="152.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Follow the caller</text>
<text x="152.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">is on: it switches</text>
<text x="152.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">language instead</text>
<rect x="270" y="226" width="200" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="370.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">A live engine runs</text>
<text x="370.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">GPT-Live 1 or</text>
<text x="370.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Gemini Live</text>
<rect x="488" y="226" width="200" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="588.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">A workflow runs</text>
<text x="588.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the workflow decides</text>
<text x="588.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">every turn</text>
<rect x="706" y="226" width="200" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="806.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The agent is busy</text>
<text x="806.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">already speaking,</text>
<text x="806.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">or the call is ending</text>
<text x="480.0" y="356.0" font-size="14" fill="#8ca5b2" text-anchor="middle">On for every Standard agent, at most twice per call; it never transfers, hangs up or runs a tool.</text>
<text x="480.0" y="376.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Per agent you can change the wording or the limit, or switch the line off.</text>
</svg>
