<rect x="0.75" y="0.75" width="958.5" height="438.5" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="24" y="28" width="620" height="200" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="36" y="46" font-size="12.5" fill="#6b7280">Test room: no phone number, no phone network</text>
<rect x="48" y="70" width="220" height="118" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="158.0" y="108.25" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Skysay&#x27;s AI caller</text>
<text x="158.0" y="125.75" font-size="12.5" fill="#4b5563" text-anchor="middle">your scenario&#x27;s persona,</text>
<text x="158.0" y="143.25" font-size="12.5" fill="#4b5563" text-anchor="middle">its own voice and listener,</text>
<text x="158.0" y="160.75" font-size="12.5" fill="#4b5563" text-anchor="middle">the noise you set</text>
<rect x="400" y="70" width="220" height="118" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="510.0" y="108.25" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Your AI agent</text>
<text x="510.0" y="125.75" font-size="12.5" fill="#4b5563" text-anchor="middle">its own saved engine:</text>
<text x="510.0" y="143.25" font-size="12.5" fill="#4b5563" text-anchor="middle">cascade, GPT-Live,</text>
<text x="510.0" y="160.75" font-size="12.5" fill="#4b5563" text-anchor="middle">Gemini Live, Eleven Realtime</text>
<path d="M276,118 L392,118" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<rect x="288.4" y="96.5" width="91.2" height="18.5" rx="4" fill="#ffffff"/>
<text x="334" y="110" font-size="12.5" fill="#374151" text-anchor="middle">talk out loud</text>
<text x="334" y="148" font-size="11.5" fill="#6b7280" text-anchor="middle">≤ 150 s by default</text>
<text x="334" y="164" font-size="11.5" fill="#6b7280" text-anchor="middle">≤ 20 caller turns</text>
<rect x="690" y="70" width="246" height="118" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="813.0" y="108.25" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Your scenario&#x27;s mocks</text>
<text x="813.0" y="125.75" font-size="12.5" fill="#4b5563" text-anchor="middle">answer SMS, booking, transfer,</text>
<text x="813.0" y="143.25" font-size="12.5" fill="#4b5563" text-anchor="middle">webhook and integration tools:</text>
<text x="813.0" y="160.75" font-size="12.5" fill="#4b5563" text-anchor="middle">nothing real is sent</text>
<path d="M620,129 L688,129" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<rect x="636.0" y="106.0" width="40.0" height="18" rx="4" fill="#ffffff"/>
<text x="656" y="119" font-size="12" fill="#374151" text-anchor="middle">tools</text>
<text x="813" y="210" font-size="11.5" fill="#4b5563" text-anchor="middle">knowledge search and ending</text>
<text x="813" y="225" font-size="11.5" fill="#4b5563" text-anchor="middle">the call still run for real</text>
<rect x="24" y="262" width="912" height="82" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="480.0" y="291.0" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Test call detail: what you get back</text>
<text x="480.0" y="308.5" font-size="12.5" fill="#4b5563" text-anchor="middle">verdict (pass, fail or error) · every rule with its evidence · reply and interruption timings</text>
<text x="480.0" y="326.0" font-size="12.5" fill="#4b5563" text-anchor="middle">what our caller heard beside what your agent recorded · recording · the final charge</text>
<path d="M334,228 L334,260" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="28" y="378" font-size="14" fill="#4b5563">A voice test is a real conversation between Skysay&#x27;s AI caller and your agent on its own engine, in a test</text>
<text x="28" y="398" font-size="14" fill="#4b5563">room. Business tools answer from your scenario&#x27;s mocks, and the result shows every rule with its evidence.</text>
