<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Ownership check: Skysay calls your number and listens for its code on your SIP connection" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Ownership check: Skysay calls your number and listens for its code on your SIP connection</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="519" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="70" y="30" width="220" height="52" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="180.0" y="61.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay</text>
<line x1="180" y1="82" x2="180" y2="356" stroke="#2c3a52" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="370" y="30" width="220" height="52" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="480.0" y="61.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Public phone network</text>
<line x1="480" y1="82" x2="480" y2="356" stroke="#2c3a52" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="670" y="30" width="220" height="52" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="780.0" y="61.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your SIP provider</text>
<line x1="780" y1="82" x2="780" y2="356" stroke="#2c3a52" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M180,128 L472,128" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="234.7" y="93" width="190.5" height="18" fill="#141d2c"/>
<text x="330.0" y="106" font-size="13" fill="#dbe4f0" text-anchor="middle" font-weight="600">1  Skysay calls your number</text>
<rect x="251.2" y="108.5" width="157.5" height="17.5" fill="#141d2c"/>
<text x="330.0" y="121" font-size="12.5" fill="#8ca5b2" text-anchor="middle">through its own carrier</text>
<path d="M480,188 L772,188" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="521.2" y="153" width="217.6" height="18" fill="#141d2c"/>
<text x="630.0" y="166" font-size="13" fill="#dbe4f0" text-anchor="middle" font-weight="600">2  The call reaches your number</text>
<rect x="574.0" y="168.5" width="112.0" height="17.5" fill="#141d2c"/>
<text x="630.0" y="181" font-size="12.5" fill="#8ca5b2" text-anchor="middle">at your provider</text>
<path d="M780,248 L188,248" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="354.3" y="213" width="251.4" height="18" fill="#141d2c"/>
<text x="480.0" y="226" font-size="13" fill="#dbe4f0" text-anchor="middle" font-weight="600">3  Your provider routes it to Skysay</text>
<rect x="414.2" y="228.5" width="131.5" height="17.5" fill="#141d2c"/>
<text x="480.0" y="241" font-size="12.5" fill="#8ca5b2" text-anchor="middle">over your SIP trunk</text>
<path d="M180,290 h46 v34 h-38" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#h-main)"/>
<rect x="236.0" y="289" width="271.6" height="18" fill="#141d2c"/>
<text x="240" y="302" font-size="13" fill="#dbe4f0" text-anchor="start" font-weight="600">4  Skysay answers by itself and listens</text>
<rect x="236.0" y="306.5" width="326.5" height="17.5" fill="#141d2c"/>
<text x="240" y="319" font-size="12.5" fill="#8ca5b2" text-anchor="start">for the one-time code it played. Nobody picks up.</text>
<rect x="60.0" y="381.0" width="240" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="180" y="400.5" font-size="13" fill="#5ad6a0" text-anchor="middle" font-weight="600">Code heard: confirmed</text>
<text x="180" y="428" font-size="12.5" fill="#8ca5b2" text-anchor="middle">calls out with this number allowed</text>
<rect x="375.0" y="381.0" width="250" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="500" y="400.5" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">Call didn't arrive</text>
<text x="500" y="428" font-size="12.5" fill="#8ca5b2" text-anchor="middle">send its calls to Skysay's SIP server</text>
<text x="500" y="445" font-size="12.5" fill="#8ca5b2" text-anchor="middle">from the addresses on the connection</text>
<rect x="675.0" y="381.0" width="250" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="800" y="400.5" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">Code not heard</text>
<text x="800" y="428" font-size="12.5" fill="#8ca5b2" text-anchor="middle">ask your provider to pass</text>
<text x="800" y="445" font-size="12.5" fill="#8ca5b2" text-anchor="middle">keypad tones (DTMF)</text>
<text x="480" y="482" font-size="14" fill="#8ca5b2" text-anchor="middle">Before your number can call out, Skysay calls it and checks the call comes back to your connection.</text>
<text x="480" y="502" font-size="14" fill="#8ca5b2" text-anchor="middle">It usually takes under a minute. Incoming calls work as soon as the number is added.</text>
</svg>
