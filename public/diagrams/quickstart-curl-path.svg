<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-label="The REST quickstart in five stages: read your workspace and project (step 1); build the agent by choosing a voice, creating it and giving it a voice stack (steps 2 to 4); test it in a text chat with no audio, no call and no charge (step 5), optionally adding a workflow (step 6); place a call, which needs outbound cleared, a number and purchased funds (step 7); and read the call, its transcript and the wallet (steps 8 and 9)." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>The REST quickstart in five stages: read your workspace and project (step 1); build the agent by choosing a voice, creating it and giving it a voice stack (steps 2 to 4); test it in a text chat with no audio, no call and no charge (step 5), optionally adding a workflow (step 6); place a call, which needs outbound cleared, a number and purchased funds (step 7); and read the call, its transcript and the wallet (steps 8 and 9).</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="305" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="25" y="50" width="166" height="96" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="108.0" y="83.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Read workspace</text>
<text x="108.0" y="103.0" font-size="14" fill="#8ca5b2" text-anchor="middle">step 1: your</text>
<text x="108.0" y="122.0" font-size="14" fill="#8ca5b2" text-anchor="middle">org and project</text>
<rect x="215" y="50" width="166" height="96" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="298.0" y="83.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Build the agent</text>
<text x="298.0" y="103.0" font-size="14" fill="#8ca5b2" text-anchor="middle">steps 2-4: voice,</text>
<text x="298.0" y="122.0" font-size="14" fill="#8ca5b2" text-anchor="middle">agent, voice stack</text>
<rect x="405" y="50" width="166" height="96" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="488.0" y="83.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Test it in text</text>
<text x="488.0" y="103.0" font-size="14" fill="#8ca5b2" text-anchor="middle">step 5: no audio,</text>
<text x="488.0" y="122.0" font-size="14" fill="#8ca5b2" text-anchor="middle">no call, no charge</text>
<rect x="595" y="50" width="166" height="96" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="678.0" y="73.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Place a call</text>
<text x="678.0" y="93.5" font-size="14" fill="#8ca5b2" text-anchor="middle">step 7: outbound</text>
<text x="678.0" y="112.5" font-size="14" fill="#8ca5b2" text-anchor="middle">cleared, a number,</text>
<text x="678.0" y="131.5" font-size="14" fill="#8ca5b2" text-anchor="middle">purchased funds</text>
<rect x="785" y="50" width="166" height="96" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="868.0" y="83.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Read the result</text>
<text x="868.0" y="103.0" font-size="14" fill="#8ca5b2" text-anchor="middle">steps 8-9: call,</text>
<text x="868.0" y="122.0" font-size="14" fill="#8ca5b2" text-anchor="middle">transcript, wallet</text>
<path d="M191,98.0 L213,98.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M381,98.0 L403,98.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M571,98.0 L593,98.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M761,98.0 L783,98.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M583.0,186 L583.0,104.0" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="458.0" y="187.0" width="250" height="30" rx="15.0" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="583.0" y="207.0" font-size="14" fill="#dbe4f0" text-anchor="middle" font-weight="600">optional: a workflow (step 6)</text>
<text x="480.0" y="264.0" font-size="14" fill="#8ca5b2" text-anchor="middle">From an empty workspace to a hosted agent that has a voice, has answered a text test and can call.</text>
<text x="480.0" y="284.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Every request is a literal curl; browser credit does not pay for the phone call.</text>
</svg>
