<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="t d"><title id="t">Standard and live conversation engines</title><desc id="d">Standard passes the caller's speech through three separate parts you choose: speech-to-text, a model and text-to-speech. A live engine hears and speaks within one session.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3f7a5e"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="451" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="20" y="36" width="920" height="156" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="54.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#6b7280" text-anchor="start">Standard (the default)</text>
<rect x="40" y="76" width="116" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="98.0" y="112.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Caller</text>
<rect x="186" y="76" width="150" height="64" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="261.0" y="102.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Speech-to-text</text>
<text x="261.0" y="123.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">hears the caller</text>
<rect x="366" y="76" width="150" height="64" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="441.0" y="102.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Model</text>
<text x="441.0" y="123.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">writes the reply</text>
<rect x="546" y="76" width="150" height="64" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="621.0" y="102.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Text-to-speech</text>
<text x="621.0" y="123.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">speaks it</text>
<path d="M156.0 108.0 L184.0 108.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M336.0 108.0 L364.0 108.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M516.0 108.0 L544.0 108.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M620.0 140.0 L620.0 170.0 L98.0 170.0 L98.0 142.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#aSec)" stroke-linejoin="round"/>
<text x="360.0" y="164.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">the reply</text>
<text x="724.0" y="84.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">You choose each part.</text>
<text x="724.0" y="100.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Interruptions, acknowledgements</text>
<text x="724.0" y="117.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">and tool-wait speech stay under</text>
<text x="724.0" y="134.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">your control.</text>
<rect x="20" y="212" width="920" height="156" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="230.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#6b7280" text-anchor="start">Live engine: GPT-Live 1, Gemini Live, Eleven Realtime when enabled</text>
<rect x="40" y="252" width="116" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="98.0" y="288.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Caller</text>
<rect x="186" y="252" width="510" height="64" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="441.0" y="278.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">One live session hears and speaks</text>
<text x="441.0" y="299.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">GPT-Live 1 also uses a backend model for tools</text>
<path d="M156.0 284.0 L184.0 284.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M620.0 316.0 L620.0 346.0 L98.0 346.0 L98.0 318.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#aSec)" stroke-linejoin="round"/>
<text x="360.0" y="340.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">the reply</text>
<text x="724.0" y="260.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">The model owns barge-in,</text>
<text x="724.0" y="276.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">backchannels and waiting speech.</text>
<text x="724.0" y="293.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">One voice speaks the whole call.</text>
<line x1="24" y1="384" x2="936" y2="384" stroke="#eef0f3" stroke-width="1"/>
<text x="24.0" y="410.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Standard turns the caller's speech into text, writes a reply with a model and speaks it with a separate voice. A live engine does</text>
<text x="24.0" y="430.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">all three in one session, so the model itself handles turn-taking.</text>
</svg>
