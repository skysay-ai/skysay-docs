<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Your own SIP trunk: calls in and out between your SIP provider and Skysay" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Your own SIP trunk: calls in and out between your SIP provider and Skysay</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="40" y="40" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="140.0" y="68.5" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Caller</text>
<text x="140.0" y="88.5" font-size="12.5" fill="#4b5563" text-anchor="middle">dials your number</text>
<rect x="40" y="170" width="200" height="80" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="140.0" y="198.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Your SIP provider</text>
<text x="140.0" y="218.0" font-size="12.5" fill="#4b5563" text-anchor="middle">keeps your numbers</text>
<text x="140.0" y="235.0" font-size="12.5" fill="#4b5563" text-anchor="middle">and bills the line</text>
<rect x="40" y="316" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="140.0" y="344.5" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Person you call</text>
<text x="140.0" y="364.5" font-size="12.5" fill="#4b5563" text-anchor="middle">sees your number</text>
<path d="M140,104 L140,168" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<path d="M140,250 L140,314" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="430" y="170" width="200" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="530.0" y="198.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Skysay SIP server</text>
<text x="530.0" y="218.0" font-size="12.5" fill="#4b5563" text-anchor="middle">port 5060, UDP or TCP</text>
<text x="530.0" y="235.0" font-size="12.5" fill="#4b5563" text-anchor="middle">no registration</text>
<path d="M240,196 L428,196" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="335" y="168" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Calls in</text>
<text x="335" y="185" font-size="12.5" fill="#4b5563" text-anchor="middle">from your provider's IPs</text>
<path d="M430,226 L242,226" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="335" y="248" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Calls out</text>
<text x="335" y="265" font-size="12.5" fill="#4b5563" text-anchor="middle">password or IP allow-list</text>
<rect x="716" y="64" width="214" height="72" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="823.0" y="96.5" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Skysay-hosted agent</text>
<text x="823.0" y="116.5" font-size="12.5" fill="#4b5563" text-anchor="middle">platform and AI usage</text>
<rect x="716" y="174" width="214" height="72" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="823.0" y="198.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Your audio agent</text>
<text x="823.0" y="218.0" font-size="12.5" fill="#4b5563" text-anchor="middle">hosted by you, audio stream</text>
<text x="823.0" y="235.0" font-size="12.5" fill="#4b5563" text-anchor="middle">$0.05 per minute</text>
<path d="M630,196 L672,196 L672,100 L714,100" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)" marker-start="url(#h-main)"/>
<path d="M630,210 L714,210" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)" marker-start="url(#h-main)"/>
<path d="M630,230 L672,230 L672,300 L712,300" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="716.0" y="285.0" width="214" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.5"/>
<text x="823" y="304.5" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="600">Text-only agent: refused</text>
<text x="823" y="340" font-size="12.5" fill="#6b7280" text-anchor="middle">The agent that answers is</text>
<text x="823" y="357" font-size="12.5" fill="#6b7280" text-anchor="middle">chosen for each number.</text>
<text x="530" y="300" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="600">Voice only:</text>
<text x="530" y="317" font-size="12.5" fill="#6b7280" text-anchor="middle">no SMS on a SIP trunk</text>
<text x="480" y="432" font-size="14" fill="#4b5563" text-anchor="middle">Your provider sends your numbers' calls to Skysay, and Skysay sends your calls out through your provider.</text>
<text x="480" y="452" font-size="14" fill="#4b5563" text-anchor="middle">Your provider keeps billing the line; Skysay charges no monthly number fee.</text>
</svg>
