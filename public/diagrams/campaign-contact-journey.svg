<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ff6b6b"/></marker><marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#ff6b6b"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#37c9d8"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#37c9d8"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8492a8"/></marker><marker id="ass" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#8492a8"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="448.5" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="24" y="92" width="176" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="112.0" y="118.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Waiting</text>
<text x="112.0" y="135.5" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">pending · scheduled</text>
<text x="112.0" y="153.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">until its calling hours</text>
<rect x="232" y="92" width="140" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="302.0" y="126.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Called</text>
<text x="302.0" y="144.25" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">dispatched</text>
<rect x="404" y="92" width="170" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="489.0" y="118.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Call ends</text>
<text x="489.0" y="135.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">one outcome, e.g.</text>
<text x="489.0" y="153.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">no answer, voicemail</text>
<rect x="606" y="92" width="150" height="76" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="681.0" y="126.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Retry?</text>
<text x="681.0" y="144.25" font-size="12.5" fill="#8ca5b2" text-anchor="middle">your retry policy</text>
<path d="M200,130 L230,130" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M372,130 L402,130" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M574,130 L604,130" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M681,92 L681,44 L112,44 L112,90" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="244.0" y="33.0" width="304.0" height="18" rx="4" fill="#141d2c"/>
<text x="396" y="46" font-size="12" fill="#dbe4f0" text-anchor="middle">yes: wait the policy&#x27;s gap, then the next attempt</text>
<rect x="790" y="96" width="146" height="32" rx="16.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="863.0" y="116.5" font-size="13" fill="#5ad6a0" font-weight="600" text-anchor="middle">completed</text>
<rect x="790" y="136" width="146" height="32" rx="16.0" fill="#1a2536" stroke="#5b6b84" stroke-width="1.5"/>
<text x="863.0" y="156.5" font-size="13" fill="#dbe4f0" font-weight="600" text-anchor="middle">failed</text>
<path d="M756,130 L774,130 L774,112 L788,112" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M774,130 L774,152 L788,152" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="765" y="120" font-size="11.5" fill="#8492a8" text-anchor="middle">no</text>
<text x="863" y="190" font-size="11.5" fill="#8ca5b2" text-anchor="middle">a conversation or voicemail;</text>
<text x="863" y="205" font-size="11.5" fill="#8ca5b2" text-anchor="middle">otherwise failed</text>
<path d="M302,168 L302,196 L150,196 L150,170" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="312" y="216" font-size="11.5" fill="#8492a8">paused, hours closed or every line busy: no attempt used</text>
<path d="M60,168 L60,236" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<rect x="24" y="238" width="176" height="32" rx="16.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="112.0" y="258.5" font-size="13" fill="#ff6b6b" font-weight="600" text-anchor="middle">never dialled</text>
<text x="112" y="288" font-size="11.5" fill="#ff6b6b" text-anchor="middle">on your do-not-call register,</text>
<text x="112" y="303" font-size="11.5" fill="#ff6b6b" text-anchor="middle">or a language the agent can't use</text>
<rect x="232" y="254" width="342" height="78" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="403.0" y="280.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">A policy can retry</text>
<text x="403.0" y="298.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">no answer · busy · voicemail</text>
<text x="403.0" y="315.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">technical failure · carrier rejected</text>
<rect x="594" y="254" width="342" height="78" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="765.0" y="280.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Never dialled again</text>
<text x="765.0" y="298.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">completed conversation · wrong party · refused</text>
<text x="765.0" y="315.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">invalid number · asked not to be contacted</text>
<text x="232" y="360" font-size="12.5" fill="#8ca5b2">A callback the agent recorded with a time is dialled at that time.</text>
<text x="28" y="400" font-size="14" fill="#8ca5b2">Each contact waits for its calling hours, is called, and gets one outcome per attempt. Your retry policy decides</text>
<text x="28" y="420" font-size="14" fill="#8ca5b2">whether it is called again; waiting for a free line or open hours never uses one of its attempts.</text>
</svg>
