<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-label="Connected once, your Pipedrive user is linked to one Skysay workspace and project with an AI agent and caller-ID number. You open a person's phone number in Pipedrive, check the name and number in the Skysay window and choose Confirm and call; a mismatched contact, number or deal is refused with no call. Your AI agent then calls the contact over the telephone, and the result is saved as a Pipedrive call activity on the person and, when selected, the deal, with outcome, connected time, a link and a summary if one is ready within two minutes. Recordings and transcripts stay in Skysay." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Connected once, your Pipedrive user is linked to one Skysay workspace and project with an AI agent and caller-ID number. You open a person's phone number in Pipedrive, check the name and number in the Skysay window and choose Confirm and call; a mismatched contact, number or deal is refused with no call. Your AI agent then calls the contact over the telephone, and the result is saved as a Pipedrive call activity on the person and, when selected, the deal, with outcome, connected time, a link and a summary if one is ready within two minutes. Recordings and transcripts stay in Skysay.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="391" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<text x="480.0" y="36.0" font-size="14" fill="#8492a8" text-anchor="middle">Connected once: your Pipedrive user to one Skysay workspace and project,</text>
<text x="480.0" y="55.0" font-size="14" fill="#8492a8" text-anchor="middle">with an AI agent, a caller-ID number and call settings</text>
<rect x="22" y="82" width="206" height="84" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="125.0" y="109.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">In Pipedrive</text>
<text x="125.0" y="129.0" font-size="14" fill="#8ca5b2" text-anchor="middle">open a person's</text>
<text x="125.0" y="148.0" font-size="14" fill="#8ca5b2" text-anchor="middle">phone number</text>
<rect x="260" y="82" width="206" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="363.0" y="109.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay window</text>
<text x="363.0" y="129.0" font-size="14" fill="#8ca5b2" text-anchor="middle">check name and number,</text>
<text x="363.0" y="148.0" font-size="14" fill="#8ca5b2" text-anchor="middle">then Confirm and call</text>
<rect x="498" y="82" width="206" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="601.0" y="109.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your AI agent calls</text>
<text x="601.0" y="129.0" font-size="14" fill="#8ca5b2" text-anchor="middle">over the telephone,</text>
<text x="601.0" y="148.0" font-size="14" fill="#8ca5b2" text-anchor="middle">not in your browser</text>
<rect x="736" y="82" width="206" height="84" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="839.0" y="109.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The contact</text>
<text x="839.0" y="129.0" font-size="14" fill="#8ca5b2" text-anchor="middle">called on</text>
<text x="839.0" y="148.0" font-size="14" fill="#8ca5b2" text-anchor="middle">their own phone</text>
<path d="M228,124 L258,124" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M466,124 L496,124" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M704,124 L734,124" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M363.0,166 L363.0,214" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="265.0" y="215.0" width="196" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="363.0" y="235.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">refused, no call</text>
<text x="363.0" y="266.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the contact, number or deal</text>
<text x="363.0" y="285.0" font-size="14" fill="#8ca5b2" text-anchor="middle">doesn't match</text>
<path d="M601.0,166 L601.0,220" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="488" y="222" width="464" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="720.0" y="247.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Result saved in Pipedrive</text>
<text x="720.0" y="267.0" font-size="14" fill="#8ca5b2" text-anchor="middle">a call activity on the person (and the deal, if selected):</text>
<text x="720.0" y="286.0" font-size="14" fill="#8ca5b2" text-anchor="middle">outcome, connected time, a link; a summary if ready in 2 min</text>
<text x="480.0" y="350.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Opening the window never places a call; closing it doesn't cancel an admitted call.</text>
<text x="480.0" y="370.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Recordings and full transcripts stay in Skysay.</text>
</svg>
