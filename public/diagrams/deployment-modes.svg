<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#c2410c"/></marker><marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#c2410c"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#3f7a5e"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#3f7a5e"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#6b7280"/></marker><marker id="ass" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#6b7280"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="528.5" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<line x1="480" y1="28" x2="480" y2="230" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="246.0" y="40" font-size="16" fill="#111827" font-weight="600" text-anchor="middle">Fully managed cloud</text>
<text x="246.0" y="60" font-size="12" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">fully_managed_cloud</text>
<rect x="24" y="84" width="116" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="82.0" y="118.75" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Caller</text>
<text x="82.0" y="136.25" font-size="12.5" fill="#4b5563" text-anchor="middle">phone call</text>
<rect x="166" y="84" width="156" height="76" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="244.0" y="110.0" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Media gateway</text>
<text x="244.0" y="127.5" font-size="12.5" fill="#4b5563" text-anchor="middle">Skysay runs it,</text>
<text x="244.0" y="145.0" font-size="12.5" fill="#4b5563" text-anchor="middle">hosted</text>
<rect x="348" y="84" width="120" height="76" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="408.0" y="110.0" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">AI providers</text>
<text x="408.0" y="127.5" font-size="12.5" fill="#4b5563" text-anchor="middle">Skysay&#x27;s</text>
<text x="408.0" y="145.0" font-size="12.5" fill="#4b5563" text-anchor="middle">keys</text>
<path d="M140,122 L164,122" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<path d="M322,122 L346,122" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<text x="714.0" y="40" font-size="16" fill="#111827" font-weight="600" text-anchor="middle">Self-hosted gateway</text>
<text x="714.0" y="60" font-size="12" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">managed_numbers_self_hosted_gateway</text>
<rect x="492" y="84" width="116" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="550.0" y="118.75" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Caller</text>
<text x="550.0" y="136.25" font-size="12.5" fill="#4b5563" text-anchor="middle">phone call</text>
<rect x="634" y="84" width="156" height="76" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="712.0" y="110.0" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Media gateway</text>
<text x="712.0" y="127.5" font-size="12.5" fill="#4b5563" text-anchor="middle">you run it on your</text>
<text x="712.0" y="145.0" font-size="12.5" fill="#4b5563" text-anchor="middle">servers (open source)</text>
<rect x="816" y="84" width="120" height="76" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="876.0" y="110.0" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">AI providers</text>
<text x="876.0" y="127.5" font-size="12.5" fill="#4b5563" text-anchor="middle">your keys, or</text>
<text x="876.0" y="145.0" font-size="12.5" fill="#4b5563" text-anchor="middle">leased per call</text>
<path d="M608,122 L632,122" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<path d="M790,122 L814,122" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<text x="24" y="188" font-size="12.5" fill="#4b5563">Fastest to live. Nothing to install: Skysay&#x27;s hosted</text>
<text x="24" y="206" font-size="12.5" fill="#4b5563">dialer places your outbound calls.</text>
<text x="492" y="188" font-size="12.5" fill="#4b5563">Runs cascade and most live engines. Workflows,</text>
<text x="492" y="206" font-size="12.5" fill="#4b5563">phone-menu navigation and one live engine run only</text>
<text x="492" y="224" font-size="12.5" fill="#4b5563">in Skysay Cloud; such a call is refused, with a reason.</text>
<path d="M174,240 L174,330" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<text x="188" y="284" font-size="12" fill="#374151">the gateway is part of Skysay Cloud</text>
<path d="M642,240 L642,330" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="656" y="260" font-size="12" fill="#374151" font-weight="600">your gateway connects out, never in:</text>
<text x="656" y="278" font-size="12" fill="#4b5563">call details and usage for billing, and</text>
<text x="656" y="296" font-size="12" fill="#4b5563">the recording and transcript, unless you</text>
<text x="656" y="314" font-size="12" fill="#4b5563">keep call content on your gateway</text>
<rect x="24" y="334" width="912" height="96" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="480" y="362" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Skysay Cloud, in both modes</text>
<rect x="40" y="378" width="152" height="34" rx="17" fill="#ffffff" stroke="#b7d3c4" stroke-width="1"/>
<text x="116" y="400" font-size="13" fill="#2f6b4f" font-weight="600" text-anchor="middle">API account</text>
<rect x="217" y="378" width="152" height="34" rx="17" fill="#ffffff" stroke="#b7d3c4" stroke-width="1"/>
<text x="293" y="400" font-size="13" fill="#2f6b4f" font-weight="600" text-anchor="middle">phone numbers</text>
<rect x="394" y="378" width="152" height="34" rx="17" fill="#ffffff" stroke="#b7d3c4" stroke-width="1"/>
<text x="470" y="400" font-size="13" fill="#2f6b4f" font-weight="600" text-anchor="middle">billing and credits</text>
<rect x="574" y="378" width="152" height="34" rx="17" fill="#ffffff" stroke="#b7d3c4" stroke-width="1"/>
<text x="650" y="400" font-size="13" fill="#2f6b4f" font-weight="600" text-anchor="middle">compliance workflow</text>
<rect x="758" y="378" width="152" height="34" rx="17" fill="#ffffff" stroke="#b7d3c4" stroke-width="1"/>
<text x="834" y="400" font-size="13" fill="#2f6b4f" font-weight="600" text-anchor="middle">abuse controls</text>
<text x="28" y="476" font-size="14" fill="#4b5563">Both modes keep your numbers, billing and compliance in Skysay Cloud. The difference is who runs the media gateway</text>
<text x="28" y="496" font-size="14" fill="#4b5563">that carries call audio, and whose AI provider keys it uses.</text>
</svg>
