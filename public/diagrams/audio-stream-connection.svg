<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#c2410c"/></marker><marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#c2410c"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#3f7a5e"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#3f7a5e"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#6b7280"/></marker><marker id="ass" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#6b7280"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="638.5" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="70" y="24" width="180" height="60" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="160.0" y="50.75" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Caller</text>
<text x="160.0" y="68.25" font-size="12.5" fill="#4b5563" text-anchor="middle">phones your number</text>
<rect x="390" y="24" width="180" height="60" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="480.0" y="50.75" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Skysay</text>
<text x="480.0" y="68.25" font-size="12.5" fill="#4b5563" text-anchor="middle">answers the call</text>
<rect x="710" y="24" width="180" height="60" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="800.0" y="50.75" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Your agent</text>
<text x="800.0" y="68.25" font-size="12.5" fill="#4b5563" text-anchor="middle">your audio_stream_url</text>
<line x1="160" y1="84" x2="160" y2="566" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="480" y1="84" x2="480" y2="566" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="800" y1="84" x2="800" y2="566" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M164,122 L474,122" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="246.2" y="101.5" width="147.5" height="18.5" rx="4" fill="#ffffff"/>
<text x="320.0" y="115" font-size="12.5" fill="#374151" text-anchor="middle">Calls; the phone rings</text>
<path d="M484,172 L794,172" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="556.9" y="151.5" width="166.2" height="18.5" rx="4" fill="#ffffff"/>
<text x="640.0" y="165" font-size="12.5" fill="#374151" text-anchor="middle">Opens a wss:// connection</text>
<rect x="500.0" y="178.0" width="280.0" height="18" rx="4" fill="#ffffff"/>
<text x="640.0" y="191" font-size="12" fill="#6b7280" text-anchor="middle">signed headers: call id, timestamp, signature</text>
<rect x="705" y="214" width="190" height="44" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="800.0" y="240.75" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">Checks the signature</text>
<path d="M796,294 L486,294" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="566.2" y="273.5" width="147.5" height="18.5" rx="4" fill="#ffffff"/>
<text x="640.0" y="287" font-size="12.5" fill="#374151" text-anchor="middle">Accepts the connection</text>
<path d="M476,236 L304,236" fill="none" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<rect x="64" y="220" width="238" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.5"/>
<text x="183.0" y="239.5" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">Not reached within 5 s</text>
<rect x="91.0" y="259.0" width="184.0" height="18" rx="4" fill="#ffffff"/>
<text x="183" y="272" font-size="12" fill="#c2410c" text-anchor="middle">Skysay hangs up: call failed,</text>
<rect x="133.0" y="277.0" width="100.0" height="18" rx="4" fill="#ffffff"/>
<text x="183" y="290" font-size="12" fill="#c2410c" text-anchor="middle">nothing charged</text>
<path d="M476,344 L166,344" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="265.0" y="323.5" width="110.0" height="18.5" rx="4" fill="#ffffff"/>
<text x="320.0" y="337" font-size="12.5" fill="#374151" text-anchor="middle">Answers the call</text>
<path d="M484,392 L794,392" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="617.0" y="372.0" width="46.0" height="18" rx="4" fill="#ffffff"/>
<text x="640.0" y="385" font-size="12" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">start</text>
<rect x="497.0" y="398.0" width="286.0" height="18" rx="4" fill="#ffffff"/>
<text x="640.0" y="411" font-size="12" fill="#6b7280" text-anchor="middle">call_id · direction · from · to · audio format</text>
<path d="M168,446 L472,446" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)" marker-start="url(#ass)"/>
<path d="M488,446 L792,446" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<rect x="283.8" y="425.5" width="72.5" height="18.5" rx="4" fill="#ffffff"/>
<text x="320" y="439" font-size="12.5" fill="#374151" text-anchor="middle">Call audio</text>
<rect x="506.9" y="425.5" width="266.2" height="18.5" rx="4" fill="#ffffff"/>
<text x="640" y="439" font-size="12.5" fill="#374151" text-anchor="middle">Audio both ways: 16 kHz, 16-bit PCM, mono</text>
<path d="M796,496 L486,496" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="566.6" y="476.0" width="146.8" height="18" rx="4" fill="#ffffff"/>
<text x="640.0" y="489" font-size="12" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">clear   or   hangup</text>
<rect x="533.0" y="502.0" width="214.0" height="18" rx="4" fill="#ffffff"/>
<text x="640.0" y="515" font-size="12" fill="#6b7280" text-anchor="middle">drop unplayed audio · end the call</text>
<path d="M484,552 L794,552" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="553.8" y="531.5" width="172.5" height="18.5" rx="4" fill="#ffffff"/>
<text x="640" y="545" font-size="12.5" fill="#374151" text-anchor="middle">stop + reason, then closes</text>
<text x="470" y="557" font-size="12" fill="#6b7280" text-anchor="end">call ends</text>
<text x="28" y="598" font-size="14" fill="#4b5563">Incoming call: Skysay opens a signed connection to your agent while the phone rings, sends start when it</text>
<text x="28" y="618" font-size="14" fill="#4b5563">answers, then streams audio both ways until stop. On a call you place, it connects to your agent before dialling.</text>
</svg>
