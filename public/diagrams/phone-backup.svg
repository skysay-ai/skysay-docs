<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-label="Phone backup: when the AI cannot take a call, Skysay rings your team phone once" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Phone backup: when the AI cannot take a call, Skysay rings your team phone once</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="489" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="60" width="140" height="72" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="102.0" y="84.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Caller</text>
<text x="102.0" y="104.0" font-size="14" fill="#8ca5b2" text-anchor="middle">calls your</text>
<text x="102.0" y="121.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Skysay number</text>
<rect x="204" y="60" width="180" height="72" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="294.0" y="84.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Can the AI take it?</text>
<text x="294.0" y="104.0" font-size="14" fill="#8ca5b2" text-anchor="middle">a free line and</text>
<text x="294.0" y="121.0" font-size="14" fill="#8ca5b2" text-anchor="middle">a setup that runs</text>
<rect x="470" y="60" width="180" height="72" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="560.0" y="92.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your AI agent</text>
<text x="560.0" y="112.5" font-size="14" fill="#8ca5b2" text-anchor="middle">answers as usual</text>
<rect x="700.0" y="81.0" width="220" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="810" y="100.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">AI answers the call</text>
<path d="M172,96 L202,96" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M384,96 L468,96" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="426" y="88" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">yes</text>
<path d="M650,96 L698,96" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M294,132 L294,222" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<text x="304" y="164" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="600">no: every line is busy,</text>
<text x="304" y="181" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="600">or the AI setup can't run</text>
<rect x="204" y="224" width="180" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="294.0" y="250.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Backup checks</text>
<text x="294.0" y="270.0" font-size="14" fill="#8ca5b2" text-anchor="middle">authorized, funds held,</text>
<text x="294.0" y="287.0" font-size="14" fill="#8ca5b2" text-anchor="middle">limits allow it</text>
<rect x="470" y="224" width="180" height="76" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="560.0" y="250.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your team phone</text>
<text x="560.0" y="270.0" font-size="14" fill="#8ca5b2" text-anchor="middle">dialled once, rings ≤ 30 s</text>
<text x="560.0" y="287.0" font-size="14" fill="#8ca5b2" text-anchor="middle">caller hears ringing</text>
<path d="M384,262 L468,262" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="700.0" y="247.0" width="220" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="810" y="266.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Connected, up to 30 min</text>
<path d="M650,262 L698,262" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M294,300 L294,360" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="176.0" y="361.0" width="236" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="294" y="380.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">As if backup were off</text>
<text x="294" y="408" font-size="14" fill="#8ca5b2" text-anchor="middle">busy signal, or the call is refused</text>
<path d="M560,300 L560,360" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="450.0" y="361.0" width="220" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="560" y="380.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Busy or no answer</text>
<text x="560" y="408" font-size="14" fill="#8ca5b2" text-anchor="middle">the call ends: no retry, no voicemail</text>
<text x="700" y="330" font-size="14" fill="#8492a8" text-anchor="start">No AI joins a backup call:</text>
<text x="700" y="347" font-size="14" fill="#8492a8" text-anchor="start">no recording, transcript</text>
<text x="700" y="364" font-size="14" fill="#8492a8" text-anchor="start">or AI charge.</text>
<text x="480" y="452" font-size="14" fill="#8ca5b2" text-anchor="middle">When the AI can't take a call, Skysay can ring your own team phone once instead.</text>
<text x="480" y="472" font-size="14" fill="#8ca5b2" text-anchor="middle">Pausing the agent or a policy refusal never triggers backup.</text>
</svg>
