<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="t d"><title id="t">How end_call is checked on live engines</title><desc id="d">On GPT-Live 1, Gemini Live and Eleven Realtime, when the agent calls end_call Skysay waits for the line the agent is speaking to finish and judges whether the agent's latest line was its goodbye. If it was, the hang-up goes ahead. If it was not, the call stays open and the agent is told so. If the line could not be judged, the hang-up goes ahead as before.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#37c9d8"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8492a8"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="371" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<text x="30.0" y="38.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#dbe4f0" text-anchor="start">Live engines: end_call needs the agent's goodbye</text>
<rect x="30" y="64" width="210" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="135.0" y="90.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Agent calls end_call</text>
<text x="135.0" y="111.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">GPT-Live 1, Gemini Live,</text>
<text x="135.0" y="128.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Eleven Realtime</text>
<rect x="290" y="64" width="290" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="435.0" y="90.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Was its latest line a goodbye?</text>
<text x="435.0" y="111.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Skysay lets the line finish, then</text>
<text x="435.0" y="128.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">judges it (usually under a second)</text>
<rect x="640" y="64" width="290" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="785.0" y="90.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Yes: the hang-up goes ahead</text>
<text x="785.0" y="111.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">The call ends, agent_completed,</text>
<text x="785.0" y="128.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">unless the caller speaks first</text>
<rect x="640" y="190" width="290" height="84" rx="12" fill="#2a1a1f" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="785.0" y="216.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">No: the call stays open</text>
<text x="785.0" y="237.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">The agent is told the call has</text>
<text x="785.0" y="254.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">not ended and carries on</text>
<rect x="290" y="190" width="290" height="84" rx="12" fill="#1a2233" stroke="#8492a8" stroke-width="1.5"/>
<text x="435.0" y="216.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Could not be judged</text>
<text x="435.0" y="237.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">The hang-up goes ahead,</text>
<text x="435.0" y="254.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">as it did before this check</text>
<path d="M240 106 L288 106" fill="none" stroke="#37c9d8" stroke-width="1.6" marker-end="url(#aMain)"/>
<path d="M580 96 L638 96" fill="none" stroke="#37c9d8" stroke-width="1.6" marker-end="url(#aMain)"/>
<text x="609.0" y="88.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#dbe4f0" text-anchor="middle">Yes</text>
<path d="M580 122 L610 122 L610 232 L638 232" fill="none" stroke="#ff6b6b" stroke-width="1.6" marker-end="url(#aFail)"/>
<text x="624.0" y="180.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#dbe4f0" text-anchor="start">No</text>
<path d="M435 148 L435 188" fill="none" stroke="#8492a8" stroke-width="1.6" marker-end="url(#aSec)"/>
<text x="30.0" y="312.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">If the caller had just spoken and the agent answered with end_call and no words, the agent is asked to say</text>
<text x="30.0" y="331.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">its goodbye if the caller is finished. That goodbye ends the call. Standard agents are not affected:</text>
<text x="30.0" y="350.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">there the goodbye is the tool's message, which Skysay speaks.</text>
</svg>
