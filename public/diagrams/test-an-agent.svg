<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Three ways to test an agent: chat in text (no audio, not metered, no call record, and SMS, transfer, webhook and integration tools are held), a browser test (your microphone, no number, browser credit or purchased funds, up to 180 seconds), and a real phone call (your number and carrier route, purchased funds only, the usual policy checks). Browser tests and phone calls are reviewed in Calls or with the call-evidence tools; only a phone call proves your number and carrier route." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Three ways to test an agent: chat in text (no audio, not metered, no call record, and SMS, transfer, webhook and integration tools are held), a browser test (your microphone, no number, browser credit or purchased funds, up to 180 seconds), and a real phone call (your number and carrier route, purchased funds only, the usual policy checks). Browser tests and phone calls are reviewed in Calls or with the call-evidence tools; only a phone call proves your number and carrier route.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="409" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="50" width="270" height="104" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="167.0" y="77.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Chat in text</text>
<text x="167.0" y="97.5" font-size="14" fill="#8ca5b2" text-anchor="middle">no audio, not metered; SMS,</text>
<text x="167.0" y="116.5" font-size="14" fill="#8ca5b2" text-anchor="middle">transfer, webhook and</text>
<text x="167.0" y="135.5" font-size="14" fill="#8ca5b2" text-anchor="middle">integration tools are held</text>
<circle cx="167.0" cy="50" r="12" fill="#37c9d8"/>
<text x="167.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">1</text>
<rect x="345" y="50" width="270" height="104" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="480.0" y="77.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Browser test</text>
<text x="480.0" y="97.5" font-size="14" fill="#8ca5b2" text-anchor="middle">your microphone, no number;</text>
<text x="480.0" y="116.5" font-size="14" fill="#8ca5b2" text-anchor="middle">browser credit or purchased</text>
<text x="480.0" y="135.5" font-size="14" fill="#8ca5b2" text-anchor="middle">funds; up to 180 seconds</text>
<circle cx="480.0" cy="50" r="12" fill="#37c9d8"/>
<text x="480.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">2</text>
<rect x="658" y="50" width="270" height="104" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="793.0" y="77.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Real phone call</text>
<text x="793.0" y="97.5" font-size="14" fill="#8ca5b2" text-anchor="middle">your number and carrier route,</text>
<text x="793.0" y="116.5" font-size="14" fill="#8ca5b2" text-anchor="middle">purchased funds only, and</text>
<text x="793.0" y="135.5" font-size="14" fill="#8ca5b2" text-anchor="middle">the usual policy checks</text>
<circle cx="793.0" cy="50" r="12" fill="#37c9d8"/>
<text x="793.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">3</text>
<path d="M302,102 L343,102" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M615,102 L656,102" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="345" y="236" width="270" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="480.0" y="263.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Review the result</text>
<text x="480.0" y="283.0" font-size="14" fill="#8ca5b2" text-anchor="middle">in Calls or the evidence tools:</text>
<text x="480.0" y="302.0" font-size="14" fill="#8ca5b2" text-anchor="middle">status, recording, transcript</text>
<path d="M480,154 L480,234" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<path d="M793,154 L793,278 L617,278" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="167.0" y="186.0" font-size="14" fill="#8492a8" text-anchor="middle">no call record, so</text>
<text x="167.0" y="205.0" font-size="14" fill="#8492a8" text-anchor="middle">nothing appears in Calls</text>
<text x="480.0" y="368.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Use any of the three; only a phone call proves your number and carrier route.</text>
<text x="480.0" y="388.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Browser credit pays for browser tests, never for phone calls.</text>
</svg>
