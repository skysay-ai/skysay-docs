<text x="52" y="56" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Full</text>
<text x="100.4" y="56" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f6b4f" text-anchor="start">https://api.skysay.ai/mcp</text>
<text x="52" y="76" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">Every tool, including wallet top-ups (only with separately consented wallet:write)</text>
<text x="76" y="126" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="start">OpenAI connector</text>
<text x="227.6" y="126" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f6b4f" text-anchor="start">https://api.skysay.ai/mcp/openai</text>
<text x="76" y="146" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">Calling and the other tools, without wallet top-ups</text>
<text x="100" y="196" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Read-only</text>
<text x="191.39999999999998" y="196" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f6b4f" text-anchor="start">https://api.skysay.ai/mcp/read-only</text>
<text x="100" y="216" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">Five workspace reads; no calls, no writes, no transcripts</text>
<text x="100" y="244" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#374151" text-anchor="start">account_overview · list_agents · get_agent · list_numbers · list_calls</text>
<text x="52" y="326" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151" text-anchor="start">Each address is its own OAuth resource: a token for one does not work on another.</text>
<text x="52" y="346" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151" text-anchor="start">On every address, each tool still needs its own scope.</text>
<text x="480.0" y="386" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">Each smaller profile is a subset of the one around it. The server enforces the profile, even for a broad key.</text>
</svg>
