<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="First, a manual read-only test: in your n8n, a manually run workflow's HTTP Request node, with a Header Auth credential, calls GET /v1/workspace-context on the Skysay REST API with an account:read key; the result proves the key reads your workspace and nothing more. Later, each call or SMS is a separate approved action: a ready number and a separate key with only the scopes it needs, a check of policy, price and destination with approval of the exact recipient, purpose, caller and text or task, one execution that keeps the returned ID, and a check of the evidence that sends blocked, review or failed outcomes to a person." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>First, a manual read-only test: in your n8n, a manually run workflow's HTTP Request node, with a Header Auth credential, calls GET /v1/workspace-context on the Skysay REST API with an account:read key; the result proves the key reads your workspace and nothing more. Later, each call or SMS is a separate approved action: a ready number and a separate key with only the scopes it needs, a check of policy, price and destination with approval of the exact recipient, purpose, caller and text or task, one execution that keeps the returned ID, and a check of the evidence that sends blocked, review or failed outcomes to a person.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<text x="32.0" y="38.0" font-size="15" fill="#dbe4f0" text-anchor="start" font-weight="600">First: a manual, read-only test</text>
<rect x="24" y="52" width="464" height="124" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="38.0" y="72.0" font-size="14" fill="#8492a8" text-anchor="start">Your n8n</text>
<rect x="40" y="82" width="180" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="130.0" y="107.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Run manually</text>
<text x="130.0" y="127.0" font-size="14" fill="#8ca5b2" text-anchor="middle">inactive, no</text>
<text x="130.0" y="146.0" font-size="14" fill="#8ca5b2" text-anchor="middle">schedule or trigger</text>
<rect x="244" y="82" width="228" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="358.0" y="107.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Read Skysay workspace</text>
<text x="358.0" y="127.0" font-size="14" fill="#8ca5b2" text-anchor="middle">HTTP Request node with</text>
<text x="358.0" y="146.0" font-size="14" fill="#8ca5b2" text-anchor="middle">a Header Auth credential</text>
<rect x="528" y="82" width="240" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="648.0" y="107.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay REST API</text>
<text x="648.0" y="127.0" font-size="14" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">GET /v1/workspace-context</text>
<text x="648.0" y="146.0" font-size="14" fill="#8ca5b2" text-anchor="middle">needs account:read</text>
<path d="M220,122 L242,122" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M472,122 L526,122" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M768,122 L790,122" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="792.0" y="107.0" width="140" height="30" rx="15.0" fill="#12302a" stroke="#37c9d8" stroke-width="1.5"/>
<text x="862.0" y="127.0" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">your workspace</text>
<text x="862.0" y="158.0" font-size="14" fill="#8ca5b2" text-anchor="middle">proves the key</text>
<text x="862.0" y="177.0" font-size="14" fill="#8ca5b2" text-anchor="middle">reads it, nothing more</text>
<text x="32.0" y="236.0" font-size="15" fill="#dbe4f0" text-anchor="start" font-weight="600">Later: each call or SMS as a separate approved action</text>
<rect x="24" y="256" width="216" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="132.0" y="281.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Number and key</text>
<text x="132.0" y="301.0" font-size="14" fill="#8ca5b2" text-anchor="middle">a ready number, a key</text>
<text x="132.0" y="320.0" font-size="14" fill="#8ca5b2" text-anchor="middle">with only needed scopes</text>
<circle cx="132.0" cy="256" r="12" fill="#37c9d8"/>
<text x="132.0" y="261.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">1</text>
<rect x="256" y="256" width="216" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="364.0" y="281.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Check and approve</text>
<text x="364.0" y="301.0" font-size="14" fill="#8ca5b2" text-anchor="middle">policy, price, destination;</text>
<text x="364.0" y="320.0" font-size="14" fill="#8ca5b2" text-anchor="middle">approve the exact action</text>
<circle cx="364.0" cy="256" r="12" fill="#37c9d8"/>
<text x="364.0" y="261.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">2</text>
<rect x="488" y="256" width="216" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="596.0" y="281.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Execute once</text>
<text x="596.0" y="301.0" font-size="14" fill="#8ca5b2" text-anchor="middle">keep the returned</text>
<text x="596.0" y="320.0" font-size="14" fill="#8ca5b2" text-anchor="middle">call or message ID</text>
<circle cx="596.0" cy="256" r="12" fill="#37c9d8"/>
<text x="596.0" y="261.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">3</text>
<rect x="720" y="256" width="216" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="828.0" y="281.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Check the evidence</text>
<text x="828.0" y="301.0" font-size="14" fill="#8ca5b2" text-anchor="middle">blocked, review or failed</text>
<text x="828.0" y="320.0" font-size="14" fill="#8ca5b2" text-anchor="middle">outcomes go to a person</text>
<circle cx="828.0" cy="256" r="12" fill="#37c9d8"/>
<text x="828.0" y="261.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">4</text>
<path d="M240,296 L254,296" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M472,296 L486,296" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M704,296 L718,296" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="480.0" y="398.0" font-size="14" fill="#8ca5b2" text-anchor="middle">n8n talks to Skysay through its built-in HTTP Request node: no community node, MCP adapter or model account.</text>
<text x="480.0" y="418.0" font-size="14" fill="#8ca5b2" text-anchor="middle">An IF node or a prompt is not approval; after an unclear failure, don't redial or resend automatically.</text>
</svg>
