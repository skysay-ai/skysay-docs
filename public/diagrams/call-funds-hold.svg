<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-label="A hosted call first holds its estimated cost from your funds, and holds another five minutes each time its funded time runs low; if no more time can be held the call ends as completed with funding_exhausted. When the call ends it is charged for its measured usage at its original prices and the unused part of the hold is returned; usage above the hold shows as payment due, and a call with no usage report after 24 hours is released without a charge. Phone calls, numbers and SMS use purchased funds; browser credit pays only for browser tests." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>A hosted call first holds its estimated cost from your funds, and holds another five minutes each time its funded time runs low; if no more time can be held the call ends as completed with funding_exhausted. When the call ends it is charged for its measured usage at its original prices and the unused part of the hold is returned; usage above the hold shows as payment due, and a call with no usage report after 24 hours is released without a charge. Phone calls, numbers and SMS use purchased funds; browser credit pays only for browser tests.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="369" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="28" y="50" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="128.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Funds held</text>
<text x="128.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">its estimated cost is</text>
<text x="128.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">reserved before it starts</text>
<circle cx="128.0" cy="50" r="12" fill="#37c9d8"/>
<text x="128.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">1</text>
<rect x="256" y="50" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="356.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">More time held</text>
<text x="356.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">5 more minutes as</text>
<text x="356.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">funded time runs low</text>
<circle cx="356.0" cy="50" r="12" fill="#37c9d8"/>
<text x="356.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">2</text>
<rect x="484" y="50" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="584.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Charged after it ends</text>
<text x="584.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">for measured usage, at</text>
<text x="584.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the original prices</text>
<circle cx="584.0" cy="50" r="12" fill="#37c9d8"/>
<text x="584.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">3</text>
<rect x="712" y="50" width="220" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="822.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Rest returned</text>
<text x="822.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">unused reserved funds</text>
<text x="822.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">go back to your balance</text>
<circle cx="822.0" cy="50" r="12" fill="#37c9d8"/>
<text x="822.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">4</text>
<path d="M228,92 L254,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M456,92 L482,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M684,92 L710,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M356.0,134 L356.0,210" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="258.0" y="211.0" width="196" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="356.0" y="231.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">funding_exhausted</text>
<text x="356.0" y="264.0" font-size="14" fill="#8ca5b2" text-anchor="middle">no more time could be held:</text>
<text x="356.0" y="283.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the connected call ends</text>
<text x="584.0" y="170.0" font-size="14" fill="#8ca5b2" text-anchor="middle">usage above the hold</text>
<text x="584.0" y="189.0" font-size="14" fill="#8ca5b2" text-anchor="middle">shows as payment due</text>
<text x="822.0" y="170.0" font-size="14" fill="#8ca5b2" text-anchor="middle">no usage report in 24 h:</text>
<text x="822.0" y="189.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the hold is returned,</text>
<text x="822.0" y="208.0" font-size="14" fill="#8ca5b2" text-anchor="middle">nothing charged</text>
<text x="480.0" y="328.0" font-size="14" fill="#8ca5b2" text-anchor="middle">A hosted call holds funds before it starts and while it runs, then is charged for what it used.</text>
<text x="480.0" y="348.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Phone calls, numbers and SMS use purchased funds; browser credit pays only for browser tests.</text>
</svg>
