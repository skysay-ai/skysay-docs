<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">When a voicemail answers</title><desc id="d">Skysay listens to the first seconds. Only a spoken greeting followed by one clean record beep and quiet proves a mailbox. With the Hang up setting the call then ends about 6.5 seconds after the beep; with Watch only, the default, the agent keeps talking and the verdict is recorded. Without proof the call is treated as a person.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3f7a5e"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="28" y="64" width="170" height="80" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="113.0" y="89.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Call answered</text>
<text x="113.0" y="110.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Skysay listens to the</text>
<text x="113.0" y="127.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">first seconds</text>
<rect x="230" y="64" width="262" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="361.0" y="89.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Proof of a mailbox?</text>
<text x="361.0" y="110.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">A spoken greeting of 3+ words, one</text>
<text x="361.0" y="127.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">clean record beep, then quiet</text>
<rect x="536" y="64" width="156" height="80" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="614.0" y="89.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Agent's setting</text>
<text x="614.0" y="110.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">When a voicemail</text>
<text x="614.0" y="127.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">answers</text>
<path d="M198.0 104.0 L228.0 104.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M492.0 104.0 L534.0 104.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<text x="513.0" y="96.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">Yes</text>
<path d="M692.0 104.0 L708.0 104.0 L708.0 62.0 L724.0 62.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M692.0 104.0 L708.0 104.0 L708.0 146.0 L724.0 146.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<text x="730.0" y="38.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start">Hang up</text>
<rect x="726.0" y="47" width="205.1" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="828.6" y="66.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">Ends ~6.5 s after the beep</text>
<text x="730.0" y="122.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start">Watch only (default)</text>
<rect x="726.0" y="131" width="198.2" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="825.1" y="150.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">Keeps talking, records it</text>
<text x="730.0" y="184.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Leave a message behaves like</text>
<text x="730.0" y="200.2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Watch only until it is released</text>
<path d="M361.0 144.0 L361.0 230.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#aSec)" stroke-linejoin="round"/>
<text x="369.0" y="172.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="start">No</text>
<text x="392.0" y="172.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">A beep under the agent's own voice does not count</text>
<rect x="230" y="232" width="462" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="461.0" y="255.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">No proof: treated as a person</text>
<text x="461.0" y="276.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Suspicion alone never acts: a fast answer, a long greeting, “leave a</text>
<text x="461.0" y="293.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">message after the tone”, music. Any sign of a person wins.</text>
<line x1="24" y1="332" x2="936" y2="332" stroke="#eef0f3" stroke-width="1"/>
<text x="24.0" y="358.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Only a record beep after a spoken greeting proves a mailbox. Every other clue only raises suspicion, and a call Skysay is not sure</text>
<text x="24.0" y="378.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">about is treated as a person. Today only an agent set to Hang up acts on the proof.</text>
</svg>
