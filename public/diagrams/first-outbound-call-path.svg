<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" width="960" height="374" role="img" aria-label="Five steps: check readiness (an active number that can call out, purchased funds and a published AI agent), read your own workspace, prepare one call recording who agreed and why, place it once with one request ID and reuse that ID and body for any retry, then read the result. Neither a policy_blocked nor a live_blocked call was dialled: policy_blocked is a refusal that must never be redialled automatically, live_blocked means live calling is switched off, needs_review is a hold, and a returned ID is a call record, not proof that somebody answered." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Five steps: check readiness (an active number that can call out, purchased funds and a published AI agent), read your own workspace, prepare one call recording who agreed and why, place it once with one request ID and reuse that ID and body for any retry, then read the result. Neither a policy_blocked nor a live_blocked call was dialled: policy_blocked is a refusal that must never be redialled automatically, live_blocked means live calling is switched off, needs_review is a hold, and a returned ID is a call record, not proof that somebody answered.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="373" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="25" y="50" width="166" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="108.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Check readiness</text>
<text x="108.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">number, funds,</text>
<text x="108.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">published agent</text>
<circle cx="108.0" cy="50" r="12" fill="#37c9d8"/>
<text x="108.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">1</text>
<rect x="215" y="50" width="166" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="298.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Read workspace</text>
<text x="298.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">this key's own</text>
<text x="298.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">org and project</text>
<circle cx="298.0" cy="50" r="12" fill="#37c9d8"/>
<text x="298.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">2</text>
<rect x="405" y="50" width="166" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="488.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Prepare one call</text>
<text x="488.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">record who</text>
<text x="488.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">agreed and why</text>
<circle cx="488.0" cy="50" r="12" fill="#37c9d8"/>
<text x="488.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">3</text>
<rect x="595" y="50" width="166" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="678.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Place it once</text>
<text x="678.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">one request ID;</text>
<text x="678.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">same ID to retry</text>
<circle cx="678.0" cy="50" r="12" fill="#37c9d8"/>
<text x="678.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">4</text>
<rect x="785" y="50" width="166" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="868.0" y="77.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Read the result</text>
<text x="868.0" y="97.0" font-size="14" fill="#8ca5b2" text-anchor="middle">status, timing,</text>
<text x="868.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">cost, evidence</text>
<circle cx="868.0" cy="50" r="12" fill="#37c9d8"/>
<text x="868.0" y="55.0" font-size="14" fill="#04121a" text-anchor="middle" font-weight="700">5</text>
<path d="M191,92 L213,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M381,92 L403,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M571,92 L593,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M761,92 L783,92" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M678.0,134 L678.0,186" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="513.0" y="187.0" width="150" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="588.0" y="207.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">policy_blocked</text>
<rect x="678.0" y="187.0" width="140" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="748.0" y="207.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">live_blocked</text>
<text x="668.0" y="240.0" font-size="14" fill="#8ca5b2" text-anchor="middle">neither was dialled. policy_blocked: refused,</text>
<text x="668.0" y="259.0" font-size="14" fill="#8ca5b2" text-anchor="middle">never redial it automatically. live_blocked:</text>
<text x="668.0" y="278.0" font-size="14" fill="#8ca5b2" text-anchor="middle">live calling is off. needs_review is a hold</text>
<text x="108.0" y="170.0" font-size="14" fill="#8ca5b2" text-anchor="middle">browser credit does</text>
<text x="108.0" y="189.0" font-size="14" fill="#8ca5b2" text-anchor="middle">not pay for phone calls</text>
<text x="480.0" y="332.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Test one approved call by hand: a returned ID is a call record, not proof that somebody answered.</text>
<text x="480.0" y="352.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Retry an unclear response with the same request ID and body; a new ID risks dialling twice.</text>
</svg>
