<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="You add contacts by CSV, Excel workbook or one at a time into contact lists that hold each person's number, names, language, time zone and custom values; a campaign calls each contact with their own values. All contacts finds one person across every list, and a number on the do-not-call register, added by you, by CSV, the API, MCP or Skysay support, is never called from the workspace; the register applies to calls, not SMS." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>You add contacts by CSV, Excel workbook or one at a time into contact lists that hold each person's number, names, language, time zone and custom values; a campaign calls each contact with their own values. All contacts finds one person across every list, and a number on the do-not-call register, added by you, by CSV, the API, MCP or Skysay support, is never called from the workspace; the register applies to calls, not SMS.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="419" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="46" width="200" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="132.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your contacts</text>
<text x="132.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">CSV, Excel workbook</text>
<text x="132.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">or one at a time</text>
<rect x="268" y="46" width="216" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="376.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Contact lists</text>
<text x="376.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">numbers, names, language,</text>
<text x="376.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">time zone, custom values</text>
<rect x="520" y="46" width="196" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="618.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Campaign</text>
<text x="618.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">calls each contact</text>
<text x="618.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">with its own values</text>
<rect x="752" y="46" width="176" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="840.0" y="71.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The contact</text>
<text x="840.0" y="91.0" font-size="14" fill="#8ca5b2" text-anchor="middle">hears the agent</text>
<text x="840.0" y="110.0" font-size="14" fill="#8ca5b2" text-anchor="middle">use their values</text>
<path d="M232,86 L266,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M484,86 L518,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M716,86 L750,86" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="268" y="226" width="216" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="376.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">All contacts</text>
<text x="376.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">find one person by number</text>
<text x="376.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">or name across every list</text>
<path d="M376,126 L376,224" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="520" y="226" width="196" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="618.0" y="251.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Do-not-call register</text>
<text x="618.0" y="271.0" font-size="14" fill="#8ca5b2" text-anchor="middle">added by you, CSV,</text>
<text x="618.0" y="290.0" font-size="14" fill="#8ca5b2" text-anchor="middle">API, MCP or support</text>
<path d="M618,226 L618,128" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<text x="630.0" y="178.0" font-size="14" fill="#ff6b6b" text-anchor="start">its numbers are never called</text>
<text x="732.0" y="262.0" font-size="14" fill="#8ca5b2" text-anchor="start">applies to calls,</text>
<text x="732.0" y="281.0" font-size="14" fill="#8ca5b2" text-anchor="start">not SMS</text>
<text x="480.0" y="378.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Campaigns call the people in your contact lists, each with their own values.</text>
<text x="480.0" y="398.0" font-size="14" fill="#8ca5b2" text-anchor="middle">A number on the do-not-call register is never called from the workspace.</text>
</svg>
