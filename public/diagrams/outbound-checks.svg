<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Checks an outbound call passes before it dials, and what each refusal looks like" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Checks an outbound call passes before it dials, and what each refusal looks like</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="449" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="110" width="140" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="102.0" y="138.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your request</text>
<text x="102.0" y="158.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">from your app</text>
<text x="102.0" y="175.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">or MCP client</text>
<rect x="196" y="110" width="140" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="266.0" y="138.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Number rules</text>
<text x="266.0" y="158.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">caller ID allowed,</text>
<text x="266.0" y="175.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">countries, agents</text>
<rect x="360" y="110" width="140" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="430.0" y="138.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Capabilities</text>
<text x="430.0" y="158.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">your country list,</text>
<text x="430.0" y="175.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">channels, caps</text>
<rect x="524" y="110" width="140" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="594.0" y="138.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Per-call policy</text>
<text x="594.0" y="158.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">suspension, number</text>
<text x="594.0" y="175.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">registration</text>
<rect x="688" y="110" width="140" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="758.0" y="138.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Funds held</text>
<text x="758.0" y="158.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">the call's cost</text>
<text x="758.0" y="175.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">is reserved</text>
<path d="M172,150.0 L194,150.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M336,150.0 L358,150.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M500,150.0 L522,150.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M664,150.0 L686,150.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M828,150.0 L850,150.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="852.0" y="135.0" width="80" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="892" y="154.5" font-size="13" fill="#5ad6a0" text-anchor="middle" font-weight="600">Dials</text>
<path d="M196,92 V80 H664 V92" fill="none" stroke="#8492a8" stroke-width="1.4"/>
<text x="430" y="56" font-size="12.5" fill="#dbe4f0" text-anchor="middle" font-weight="600">“Check before you call” asks these three, without creating anything</text>
<text x="430" y="73" font-size="12.5" fill="#8492a8" text-anchor="middle">(number rules only when you name the caller number)</text>
<text x="758" y="73" font-size="12.5" fill="#8492a8" text-anchor="middle">not in the preflight</text>
<path d="M266.0,190 L266.0,254" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="191.0" y="255.0" width="150" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="266.0" y="274.5" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">403, no call</text>
<text x="266.0" y="302" font-size="12.5" fill="#8ca5b2" text-anchor="middle">no record is created</text>
<path d="M430.0,190 L430.0,254" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="355.0" y="255.0" width="150" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="430.0" y="274.5" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">Held or blocked</text>
<text x="430.0" y="302" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">needs_review or</text>
<text x="430.0" y="318" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">policy_blocked</text>
<path d="M594.0,190 L594.0,254" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="519.0" y="255.0" width="150" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="594.0" y="274.5" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">Blocked</text>
<text x="594.0" y="302" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">policy_blocked</text>
<text x="480" y="360" font-size="13" fill="#dbe4f0" text-anchor="middle" font-weight="600">A refused call is never dialled and never retried for you. The refusal says why.</text>
<text x="480" y="384" font-size="12.5" fill="#8492a8" text-anchor="middle">Also checked before dialling: your simultaneous-call limit and do-not-call list.</text>
<text x="480" y="432" font-size="14" fill="#8ca5b2" text-anchor="middle">Every outbound call passes these checks before anything dials; the first one that refuses ends it.</text>
</svg>
