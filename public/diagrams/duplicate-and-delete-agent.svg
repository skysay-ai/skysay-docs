<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Duplicate makes a stopped, unpublished copy of an AI agent's latest saved configuration with its own signing secret: prompts, voice, tools, variables and the workflow draft are copied; knowledge bases, connections and credentials stay shared; numbers, campaigns, calls and publication are not copied. Delete first checks the agent's dependencies (numbers, routes, unfinished campaigns, calls, workflows and more) and is unavailable while the agent is suspended; while any remain you resolve them and check again, and when you confirm it is checked once more before the agent is deleted, with its calls, transcripts and billing records kept." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Duplicate makes a stopped, unpublished copy of an AI agent's latest saved configuration with its own signing secret: prompts, voice, tools, variables and the workflow draft are copied; knowledge bases, connections and credentials stay shared; numbers, campaigns, calls and publication are not copied. Delete first checks the agent's dependencies (numbers, routes, unfinished campaigns, calls, workflows and more) and is unavailable while the agent is suspended; while any remain you resolve them and check again, and when you confirm it is checked once more before the agent is deleted, with its calls, transcripts and billing records kept.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="519" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<text x="32.0" y="34.0" font-size="15" fill="#dbe4f0" text-anchor="start" font-weight="600">Duplicate</text>
<rect x="32" y="64" width="180" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="122.0" y="89.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your AI agent</text>
<text x="122.0" y="109.0" font-size="14" fill="#8ca5b2" text-anchor="middle">its latest saved</text>
<text x="122.0" y="128.0" font-size="14" fill="#8ca5b2" text-anchor="middle">configuration</text>
<rect x="244" y="46" width="476" height="116" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="258.0" y="66.0" font-size="14" fill="#8492a8" text-anchor="start"></text>
<text x="258.0" y="38.0" font-size="14" fill="#8492a8" text-anchor="start">The copy: stopped, unpublished, its own signing secret</text>
<rect x="258" y="64" width="216" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="366.0" y="89.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Copied</text>
<text x="366.0" y="109.0" font-size="14" fill="#8ca5b2" text-anchor="middle">prompts, voice, tools,</text>
<text x="366.0" y="128.0" font-size="14" fill="#8ca5b2" text-anchor="middle">variables, workflow draft</text>
<rect x="490" y="64" width="216" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="598.0" y="89.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Shared, not copied</text>
<text x="598.0" y="109.0" font-size="14" fill="#8ca5b2" text-anchor="middle">knowledge bases,</text>
<text x="598.0" y="128.0" font-size="14" fill="#8ca5b2" text-anchor="middle">connections, credentials</text>
<path d="M212,104 L242,104" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="748" y="64" width="180" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="838.0" y="89.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Not copied</text>
<text x="838.0" y="109.0" font-size="14" fill="#8ca5b2" text-anchor="middle">numbers, campaigns,</text>
<text x="838.0" y="128.0" font-size="14" fill="#8ca5b2" text-anchor="middle">calls, publication</text>
<text x="32.0" y="230.0" font-size="15" fill="#dbe4f0" text-anchor="start" font-weight="600">Delete</text>
<rect x="32" y="254" width="220" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="142.0" y="279.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Dependency check</text>
<text x="142.0" y="299.0" font-size="14" fill="#8ca5b2" text-anchor="middle">numbers, routes, unfinished</text>
<text x="142.0" y="318.0" font-size="14" fill="#8ca5b2" text-anchor="middle">campaigns, calls and more</text>
<rect x="336" y="254" width="220" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="446.0" y="279.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">You confirm</text>
<text x="446.0" y="299.0" font-size="14" fill="#8ca5b2" text-anchor="middle">checked again</text>
<text x="446.0" y="318.0" font-size="14" fill="#8ca5b2" text-anchor="middle">at that moment</text>
<path d="M252,294 L334,294" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="293.0" y="284.0" font-size="14" fill="#8492a8" text-anchor="middle">none left</text>
<path d="M556,294 L640,294" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="642.0" y="279.0" width="220" height="30" rx="15.0" fill="#12302a" stroke="#37c9d8" stroke-width="1.5"/>
<text x="752.0" y="299.0" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Deleted, history kept</text>
<text x="752.0" y="330.0" font-size="14" fill="#8ca5b2" text-anchor="middle">calls, transcripts and</text>
<text x="752.0" y="349.0" font-size="14" fill="#8ca5b2" text-anchor="middle">billing stay readable</text>
<path d="M142,334 L142,382" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="32.0" y="385.0" width="220" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="142.0" y="405.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">In use: resolve it</text>
<path d="M252,400 L290,400 L290,316 L254,316" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<text x="300.0" y="382.0" font-size="14" fill="#8492a8" text-anchor="start">Check again</text>
<text x="480.0" y="478.0" font-size="14" fill="#8ca5b2" text-anchor="middle">A copy starts stopped and unpublished; editing a shared resource affects both AI agents.</text>
<text x="480.0" y="498.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Delete works only once nothing uses the agent and it isn't suspended; it is checked again when you confirm.</text>
</svg>
