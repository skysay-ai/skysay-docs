<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Forward to a phone: every call to the number rings your own phone once, with no AI agent" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Forward to a phone: every call to the number rings your own phone once, with no AI agent</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="409" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="60" width="140" height="100" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="102" y="98" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Caller</text>
<text x="102" y="118" font-size="14" fill="#8ca5b2" text-anchor="middle">calls your</text>
<text x="102" y="135" font-size="14" fill="#8ca5b2" text-anchor="middle">Skysay number</text>
<rect x="204" y="60" width="180" height="100" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="294" y="90" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay checks</text>
<text x="294" y="110" font-size="14" fill="#8ca5b2" text-anchor="middle">the forwarding rule,</text>
<text x="294" y="127" font-size="14" fill="#8ca5b2" text-anchor="middle">holds funds,</text>
<text x="294" y="144" font-size="14" fill="#8ca5b2" text-anchor="middle">checks your limits</text>
<rect x="440" y="60" width="220" height="100" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="550" y="86" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your phone</text>
<text x="550" y="106" font-size="14" fill="#8ca5b2" text-anchor="middle">dialled once, rings ≤ 30 s</text>
<text x="550" y="123" font-size="14" fill="#8ca5b2" text-anchor="middle">shows your Skysay number</text>
<text x="550" y="140" font-size="14" fill="#8ca5b2" text-anchor="middle">caller hears a ring every 5 s</text>
<path d="M172,110 L202,110" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M384,110 L438,110" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M660,110 L698,110" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="700" y="95" width="228" height="30" rx="15" fill="#12302a" stroke="#5ad6a0" stroke-width="1.5"/>
<text x="814" y="114.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Connected, up to 30 min</text>
<path d="M294,160 L294,250" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<text x="304" y="200" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="600">a check refuses</text>
<rect x="186" y="252" width="216" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="294" y="271.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Not forwarded</text>
<text x="294" y="302" font-size="14" fill="#8ca5b2" text-anchor="middle">listed in Calls with its reason</text>
<path d="M550,160 L550,250" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="430" y="252" width="240" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="550" y="271.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Busy, no answer or hang-up</text>
<text x="550" y="302" font-size="14" fill="#8ca5b2" text-anchor="middle">the call ends: no retry, no voicemail</text>
<text x="706" y="200" font-size="14" fill="#8492a8" text-anchor="start">No AI joins a forwarded</text>
<text x="706" y="217" font-size="14" fill="#8492a8" text-anchor="start">call: no recording,</text>
<text x="706" y="234" font-size="14" fill="#8492a8" text-anchor="start">transcript or AI charge.</text>
<text x="480" y="356" font-size="14" fill="#8ca5b2" text-anchor="middle">Every call to a forwarding number rings your own phone once, with no AI agent.</text>
<text x="480" y="376" font-size="14" fill="#8ca5b2" text-anchor="middle">The caller's call is connected, and can be billed, from when your phone starts ringing.</text>
</svg>
