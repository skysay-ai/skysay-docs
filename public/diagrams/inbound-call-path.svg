<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="How an incoming call reaches your AI agent, and when Skysay refuses it" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>How an incoming call reaches your AI agent, and when Skysay refuses it</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="429" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="388" y="40" width="368" height="124" rx="12" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="400" y="58" font-size="14" fill="#8492a8" text-anchor="start">Skysay</text>
<rect x="32" y="70" width="150" height="76" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="107.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Caller</text>
<text x="107.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">dials your number</text>
<text x="107.0" y="133.0" font-size="14" fill="#8ca5b2" text-anchor="middle">+44 20 …</text>
<rect x="218" y="70" width="150" height="76" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="293.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Phone company</text>
<text x="293.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the caller's network</text>
<text x="293.0" y="133.0" font-size="14" fill="#8ca5b2" text-anchor="middle">carries the call</text>
<rect x="404" y="70" width="150" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="479.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your number</text>
<text x="479.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">active, takes</text>
<text x="479.0" y="133.0" font-size="14" fill="#8ca5b2" text-anchor="middle">incoming calls</text>
<rect x="590" y="70" width="150" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="665.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Number rules</text>
<text x="665.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">pick which AI</text>
<text x="665.0" y="133.0" font-size="14" fill="#8ca5b2" text-anchor="middle">agent answers</text>
<rect x="776" y="70" width="150" height="76" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="851.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your AI agent</text>
<text x="851.0" y="116.0" font-size="14" fill="#8ca5b2" text-anchor="middle">answers and</text>
<text x="851.0" y="133.0" font-size="14" fill="#8ca5b2" text-anchor="middle">talks with the caller</text>
<path d="M182,108.0 L216,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M368,108.0 L402,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M554,108.0 L588,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M740,108.0 L774,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="776.0" y="185.0" width="150" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="851.0" y="204.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Call answered</text>
<path d="M851.0,146 L851.0,183" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M572,164 L572,250" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="492.0" y="251.0" width="160" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="572" y="270.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Call refused</text>
<text x="400" y="312" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="600">Skysay refuses the call when:</text>
<text x="410" y="332" font-size="14" fill="#8ca5b2" text-anchor="start">• every Skysay phone line is busy (the caller hears a busy signal)</text>
<text x="410" y="349" font-size="14" fill="#8ca5b2" text-anchor="start">• the agent's published setup or workflow can't run</text>
<text x="410" y="366" font-size="14" fill="#8ca5b2" text-anchor="start">• your workspace hasn't enough purchased funds, or is at its call limit</text>
<text x="410" y="383" font-size="14" fill="#8ca5b2" text-anchor="start">• the Number rules say not to answer</text>
<text x="32" y="262" font-size="14" fill="#8492a8" text-anchor="start">With phone backup on, the first two</text>
<text x="32" y="279" font-size="14" fill="#8492a8" text-anchor="start">can ring your team phone instead.</text>
<text x="480" y="418" font-size="14" fill="#8ca5b2" text-anchor="middle">A call to your number reaches Skysay through the caller's phone company; your Number rules choose the agent.</text>
</svg>
