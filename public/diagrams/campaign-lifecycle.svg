<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ff6b6b"/></marker><marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#ff6b6b"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#37c9d8"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#37c9d8"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8492a8"/></marker><marker id="ass" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#8492a8"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="438.5" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="24" y="150" width="164" height="72" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="106.0" y="174.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Draft</text>
<text x="106.0" y="191.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">edit anything;</text>
<text x="106.0" y="209.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">one test call at a time</text>
<rect x="214" y="150" width="164" height="72" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="296.0" y="174.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Launch check</text>
<text x="296.0" y="191.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">workspace, consent,</text>
<text x="296.0" y="209.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">countries</text>
<path d="M188,186 L212,186" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="426" y="36" width="150" height="64" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="501.0" y="64.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Scheduled</text>
<text x="501.0" y="82.25" font-size="12.5" fill="#8ca5b2" text-anchor="middle">until its start time</text>
<rect x="606" y="150" width="150" height="72" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="681.0" y="174.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Running</text>
<text x="681.0" y="191.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">calls contacts in</text>
<text x="681.0" y="209.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">their calling hours</text>
<rect x="606" y="300" width="150" height="64" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="681.0" y="328.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Paused</text>
<text x="681.0" y="346.25" font-size="12.5" fill="#8ca5b2" text-anchor="middle">change hours, retries</text>
<path d="M378,186 L604,186" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="428.0" y="165.0" width="124.0" height="18" rx="4" fill="#141d2c"/>
<text x="490" y="178" font-size="12" fill="#dbe4f0" text-anchor="middle">allowed, starts now</text>
<path d="M296,150 L296,68 L424,68" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="360" y="60" font-size="12" fill="#dbe4f0" text-anchor="middle">allowed, later</text>
<path d="M576,68 L681,68 L681,148" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="640" y="60" font-size="12" fill="#dbe4f0" text-anchor="middle">start time</text>
<path d="M666,222 L666,298" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<path d="M696,300 L696,224" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="640" y="268" font-size="12" fill="#dbe4f0" text-anchor="end">Pause</text>
<text x="722" y="268" font-size="12" fill="#dbe4f0">Resume</text>
<rect x="790" y="168" width="146" height="36" rx="18.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="863.0" y="190.5" font-size="13" fill="#5ad6a0" font-weight="600" text-anchor="middle">Completed</text>
<path d="M756,186 L788,186" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="863" y="226" font-size="11.5" fill="#8ca5b2" text-anchor="middle">every contact done,</text>
<text x="863" y="241" font-size="11.5" fill="#8ca5b2" text-anchor="middle">or its end date</text>
<rect x="790" y="314" width="146" height="36" rx="18.0" fill="#1a2536" stroke="#5b6b84" stroke-width="1.5"/>
<text x="863.0" y="336.5" font-size="13" fill="#dbe4f0" font-weight="600" text-anchor="middle">Cancelled</text>
<path d="M756,332 L788,332" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="863" y="370" font-size="11.5" fill="#8ca5b2" text-anchor="middle">Cancel also works while</text>
<text x="863" y="385" font-size="11.5" fill="#8ca5b2" text-anchor="middle">scheduled or running</text>
<rect x="214" y="300" width="164" height="64" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="296.0" y="328.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Needs review</text>
<text x="296.0" y="346.25" font-size="12.5" fill="#8ca5b2" text-anchor="middle">e.g. a new country</text>
<path d="M276,222 L276,298" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<path d="M316,300 L316,224" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="324" y="268" font-size="11.5" fill="#8492a8">launch again</text>
<rect x="24" y="314" width="150" height="36" rx="18.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="99.0" y="336.5" font-size="13" fill="#ff6b6b" font-weight="600" text-anchor="middle">Blocked</text>
<path d="M244,222 L244,250 L99,250 L99,312" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<text x="28" y="410" font-size="14" fill="#8ca5b2">A launch runs one check on your workspace: allowed campaigns start calling, others wait for review or are</text>
<text x="28" y="430" font-size="14" fill="#8ca5b2">blocked. The list, agent, purpose and consent are fixed at launch; pause to change the rest.</text>
</svg>
