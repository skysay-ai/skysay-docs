<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Review webpage numbers, then choose one call or a campaign draft." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Review webpage numbers, then choose one call or a campaign draft</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#37c9d8"/></marker></defs>
<rect x="1" y="1" width="858" height="378" rx="12" fill="#141d2c" stroke="#243049"/>
<rect x="24" y="126" width="190" height="112" rx="12" fill="#1a2536" stroke="#2c3a52"/>
<text x="119" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#dbe4f0">Webpage</text>
<text x="119" y="185" text-anchor="middle" font-size="14" fill="#8ca5b2">Select a number or</text>
<text x="119" y="207" text-anchor="middle" font-size="14" fill="#8ca5b2">review visible contacts</text>
<path d="M214 182 H260" fill="none" stroke="#37c9d8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="268" y="112" width="230" height="140" rx="12" fill="#14262b" stroke="#37c9d8"/>
<text x="383" y="144" text-anchor="middle" font-size="16" font-weight="600" fill="#dbe4f0">Review in the panel</text>
<text x="383" y="176" text-anchor="middle" font-size="14" fill="#8ca5b2">International destination</text>
<text x="383" y="198" text-anchor="middle" font-size="14" fill="#8ca5b2">AI agent and caller ID</text>
<text x="383" y="230" text-anchor="middle" font-size="14" fill="#dbe4f0">You choose the action</text>
<path d="M498 182 H530" fill="none" stroke="#37c9d8" stroke-width="2"/>
<path d="M530 182 V94 H568" fill="none" stroke="#37c9d8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M530 182 V264 H568" fill="none" stroke="#37c9d8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="38" width="260" height="112" rx="12" fill="#12302a" stroke="#5ad6a0"/>
<text x="706" y="69" text-anchor="middle" font-size="16" font-weight="600" fill="#dbe4f0">Call with AI</text>
<text x="706" y="98" text-anchor="middle" font-size="14" fill="#8ca5b2">One deliberate call</text>
<text x="706" y="123" text-anchor="middle" font-size="14" fill="#5ad6a0">Follow its actual status</text>
<rect x="576" y="208" width="260" height="112" rx="12" fill="#14262b" stroke="#37c9d8"/>
<text x="706" y="239" text-anchor="middle" font-size="16" font-weight="600" fill="#dbe4f0">Save draft campaign</text>
<text x="706" y="268" text-anchor="middle" font-size="14" fill="#8ca5b2">Only selected contacts</text>
<text x="706" y="293" text-anchor="middle" font-size="14" fill="#dbe4f0">Launch separately in Skysay</text>
<text x="430" y="352" text-anchor="middle" font-size="14" fill="#8ca5b2">Discovery stays on device. Only confirmed numbers or selected import rows are sent.</text>
</svg>
