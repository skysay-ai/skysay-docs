<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Keep your number: your provider forwards chosen calls to a Skysay AI line" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Keep your number: your provider forwards chosen calls to a Skysay AI line</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="70" width="150" height="76" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="107.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Caller</text>
<text x="107.0" y="116.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">dials your</text>
<text x="107.0" y="133.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">business number</text>
<rect x="214" y="70" width="180" height="76" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="304.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your provider</text>
<text x="304.0" y="116.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">keeps your number</text>
<text x="304.0" y="133.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">and its SMS</text>
<rect x="604" y="70" width="150" height="76" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="679.0" y="96.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay AI line</text>
<text x="679.0" y="116.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">a separate</text>
<text x="679.0" y="133.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">Skysay number</text>
<rect x="786" y="70" width="142" height="76" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="857.0" y="104.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your AI agent</text>
<text x="857.0" y="124.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">answers</text>
<path d="M182,108.0 L212,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M394,108.0 L602,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="499" y="82.0" font-size="13" fill="#dbe4f0" text-anchor="middle" font-weight="600">Forwards when</text>
<text x="499" y="98.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">busy · unanswered</text>
<text x="499" y="130.0" font-size="12.5" fill="#8ca5b2" text-anchor="middle">unreachable · or always</text>
<path d="M754,108.0 L784,108.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M304,146 L304,206" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="214" y="208" width="180" height="64" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="304.0" y="236.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your phones</text>
<text x="304.0" y="256.5" font-size="12.5" fill="#8ca5b2" text-anchor="middle">calls you don't forward</text>
<path d="M679,146 L679,224" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="554.0" y="225.0" width="250" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="679" y="244.5" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">AI line can't take it</text>
<text x="679" y="272" font-size="12.5" fill="#8ca5b2" text-anchor="middle">refused as usual, or your team phone</text>
<text x="679" y="289" font-size="12.5" fill="#8ca5b2" text-anchor="middle">if phone backup is on</text>
<text x="480" y="362" font-size="14" fill="#8ca5b2" text-anchor="middle">Your number stays with your current provider, which forwards the calls you choose to a Skysay line.</text>
<text x="480" y="382" font-size="14" fill="#8ca5b2" text-anchor="middle">Text messages are not forwarded.</text>
</svg>
