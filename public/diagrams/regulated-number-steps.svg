<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Regulated numbers: five steps from your details to an active number, and where you pay" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Regulated numbers: five steps from your details to an active number, and where you pay</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="32" y="120" width="150" height="80" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="107.0" y="148.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Your details</text>
<text x="107.0" y="168.0" font-size="12.5" fill="#4b5563" text-anchor="middle">person or business,</text>
<text x="107.0" y="185.0" font-size="12.5" fill="#4b5563" text-anchor="middle">documents</text>
<rect x="214" y="120" width="150" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="289.0" y="148.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Skysay approval</text>
<text x="289.0" y="168.0" font-size="12.5" fill="#4b5563" text-anchor="middle">Skysay reviews</text>
<text x="289.0" y="185.0" font-size="12.5" fill="#4b5563" text-anchor="middle">what you sent</text>
<rect x="396" y="120" width="150" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="471.0" y="148.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Carrier rules</text>
<text x="471.0" y="168.0" font-size="12.5" fill="#4b5563" text-anchor="middle">your details checked</text>
<text x="471.0" y="185.0" font-size="12.5" fill="#4b5563" text-anchor="middle">against them</text>
<rect x="618" y="120" width="150" height="80" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="693.0" y="148.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Carrier review</text>
<text x="693.0" y="168.0" font-size="12.5" fill="#4b5563" text-anchor="middle">the carrier's own</text>
<text x="693.0" y="185.0" font-size="12.5" fill="#4b5563" text-anchor="middle">compliance review</text>
<rect x="800" y="120" width="128" height="80" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="864.0" y="156.5" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Number active</text>
<text x="864.0" y="176.5" font-size="12.5" fill="#4b5563" text-anchor="middle">ready for calls</text>
<circle cx="48" cy="106" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="48" y="110.5" font-size="12.5" fill="#374151" text-anchor="middle" font-weight="600">1</text>
<circle cx="230" cy="106" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="230" y="110.5" font-size="12.5" fill="#374151" text-anchor="middle" font-weight="600">2</text>
<circle cx="412" cy="106" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="412" y="110.5" font-size="12.5" fill="#374151" text-anchor="middle" font-weight="600">3</text>
<circle cx="634" cy="106" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="634" y="110.5" font-size="12.5" fill="#374151" text-anchor="middle" font-weight="600">4</text>
<circle cx="816" cy="106" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="816" y="110.5" font-size="12.5" fill="#374151" text-anchor="middle" font-weight="600">5</text>
<path d="M182,160.0 L212,160.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M364,160.0 L394,160.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M546,160.0 L616,160.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M768,160.0 L798,160.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<line x1="582.0" y1="64" x2="582.0" y2="218" stroke="#4c63d2" stroke-width="1.6" stroke-dasharray="3 3"/>
<rect x="507.0" y="37.0" width="150" height="30" rx="15.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="582.0" y="56.5" font-size="13" fill="#374151" text-anchor="middle" font-weight="600">You pay here</text>
<text x="582.0" y="236" font-size="12.5" fill="#4c63d2" text-anchor="middle" font-weight="600">the number is bought</text>
<text x="582.0" y="253" font-size="12.5" fill="#4c63d2" text-anchor="middle" font-weight="600">before carrier review</text>
<text x="496.0" y="57" font-size="12.5" fill="#6b7280" text-anchor="end" font-weight="600">before you pay ←</text>
<text x="668.0" y="57" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="600">→ after you pay</text>
<path d="M693.0,200 L693.0,300" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="568.0" y="301.0" width="250" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.5"/>
<text x="693.0" y="320.5" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="600">Carrier rejects</text>
<text x="693.0" y="348" font-size="12.5" fill="#4b5563" text-anchor="middle">it can leave a paid number that can't activate</text>
<text x="480" y="402" font-size="14" fill="#4b5563" text-anchor="middle">For numbers that need registration, Skysay checks your details against the carrier's rules before you pay.</text>
<text x="480" y="422" font-size="14" fill="#4b5563" text-anchor="middle">Passing those checks is not carrier approval: the carrier reviews only after the number is bought.</text>
</svg>
