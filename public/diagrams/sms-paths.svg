<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Sending: your app or AI client confirms the recipient, sender and text with a person, then Skysay checks the send like a call (the number, suspensions, destination countries) and passes it to the carrier, then reports its status and delivery events. A voice-only number, or one on a carrier Skysay doesn't send SMS through, is refused with a 400 before anything is stored or charged; while SMS sending is not switched on a message is kept as live_blocked, never queued. Receiving: a text to your number lands in your SMS inbox and goes to your sms.received webhook; AI agents do not answer texts on their own." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Sending: your app or AI client confirms the recipient, sender and text with a person, then Skysay checks the send like a call (the number, suspensions, destination countries) and passes it to the carrier, then reports its status and delivery events. A voice-only number, or one on a carrier Skysay doesn't send SMS through, is refused with a 400 before anything is stored or charged; while SMS sending is not switched on a message is kept as live_blocked, never queued. Receiving: a text to your number lands in your SMS inbox and goes to your sms.received webhook; AI agents do not answer texts on their own.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<text x="32.0" y="40.0" font-size="15" fill="#dbe4f0" text-anchor="start" font-weight="600">Sending</text>
<rect x="32" y="58" width="214" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="139.0" y="85.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your app or AI client</text>
<text x="139.0" y="105.0" font-size="14" fill="#8ca5b2" text-anchor="middle">confirms recipient, sender</text>
<text x="139.0" y="124.0" font-size="14" fill="#8ca5b2" text-anchor="middle">and text with a person</text>
<rect x="300" y="58" width="230" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="415.0" y="85.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay checks it</text>
<text x="415.0" y="105.0" font-size="14" fill="#8ca5b2" text-anchor="middle">like a call: the number,</text>
<text x="415.0" y="124.0" font-size="14" fill="#8ca5b2" text-anchor="middle">suspensions, countries</text>
<rect x="584" y="58" width="236" height="84" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="702.0" y="85.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Sent to the carrier</text>
<text x="702.0" y="105.0" font-size="14" fill="#8ca5b2" text-anchor="middle">then its status and</text>
<text x="702.0" y="124.0" font-size="14" fill="#8ca5b2" text-anchor="middle">delivery events</text>
<path d="M246,100 L298,100" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M530,100 L582,100" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M360,142 L360,190" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="260.0" y="191.0" width="200" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="360.0" y="211.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">400: can't send</text>
<text x="360.0" y="242.0" font-size="14" fill="#8ca5b2" text-anchor="middle">voice-only number, or a carrier</text>
<text x="360.0" y="261.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Skysay doesn't send SMS through:</text>
<text x="360.0" y="280.0" font-size="14" fill="#8ca5b2" text-anchor="middle">nothing stored or charged</text>
<path d="M472,142 L612,190" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="580.0" y="191.0" width="160" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="660.0" y="211.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">live_blocked</text>
<text x="660.0" y="242.0" font-size="14" fill="#8ca5b2" text-anchor="middle">sending not switched on:</text>
<text x="660.0" y="261.0" font-size="14" fill="#8ca5b2" text-anchor="middle">kept, never queued</text>
<text x="32.0" y="300.0" font-size="15" fill="#dbe4f0" text-anchor="start" font-weight="600">Receiving</text>
<rect x="32" y="318" width="214" height="64" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="139.0" y="354.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">A text to your number</text>
<rect x="300" y="318" width="230" height="64" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="415.0" y="344.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your SMS inbox</text>
<text x="415.0" y="364.5" font-size="14" fill="#8ca5b2" text-anchor="middle">in the workspace</text>
<rect x="584" y="318" width="236" height="64" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="702.0" y="344.5" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your webhook</text>
<text x="702.0" y="364.5" font-size="14" fill="#8ca5b2" text-anchor="middle">gets sms.received</text>
<path d="M246,350 L298,350" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M530,350 L582,350" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="480.0" y="428.0" font-size="14" fill="#8ca5b2" text-anchor="middle">There is no approval step, so confirm a live send yourself. A message ID means a record exists, not delivery.</text>
<text x="480.0" y="448.0" font-size="14" fill="#8ca5b2" text-anchor="middle">AI agents don't answer texts on their own: an incoming text lands in SMS and goes to your webhook.</text>
</svg>
