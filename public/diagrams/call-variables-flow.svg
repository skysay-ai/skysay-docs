<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="You declare an agent's variables once and write them into its greeting, workflow lines, instructions and SMS as {{name}}; each call brings its own values from the API, a campaign's contact list, a test or caller lookup. Before the call starts its spoken lines are filled in and every value checked: a missing or invalid value refuses the call, naming the variable but never its value. Greetings, workflow lines and SMS are said or sent with the values filled in, while instructions only name a variable and the values reach the model as data." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>You declare an agent's variables once and write them into its greeting, workflow lines, instructions and SMS as {{name}}; each call brings its own values from the API, a campaign's contact list, a test or caller lookup. Before the call starts its spoken lines are filled in and every value checked: a missing or invalid value refuses the call, naming the variable but never its value. Greetings, workflow lines and SMS are said or sent with the values filled in, while instructions only name a variable and the values reach the model as data.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="40" width="230" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="147.0" y="65.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Declare variables</text>
<text x="147.0" y="85.0" font-size="14" fill="#8ca5b2" text-anchor="middle">name, type, required;</text>
<text x="147.0" y="104.0" font-size="14" fill="#8ca5b2" text-anchor="middle">once per agent</text>
<rect x="32" y="150" width="230" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="147.0" y="175.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Write {{name}} in lines</text>
<text x="147.0" y="195.0" font-size="14" fill="#8ca5b2" text-anchor="middle">greeting, workflow lines,</text>
<text x="147.0" y="214.0" font-size="14" fill="#8ca5b2" text-anchor="middle">instructions, SMS</text>
<rect x="32" y="260" width="230" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="147.0" y="285.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Each call's values</text>
<text x="147.0" y="305.0" font-size="14" fill="#8ca5b2" text-anchor="middle">API, campaign list,</text>
<text x="147.0" y="324.0" font-size="14" fill="#8ca5b2" text-anchor="middle">test or caller lookup</text>
<rect x="330" y="150" width="220" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="440.0" y="175.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Checked first</text>
<text x="440.0" y="195.0" font-size="14" fill="#8ca5b2" text-anchor="middle">spoken lines filled in,</text>
<text x="440.0" y="214.0" font-size="14" fill="#8ca5b2" text-anchor="middle">every value checked</text>
<path d="M262,80 L296,80 L296,176 L328,176" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<path d="M262,190 L328,190" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<path d="M262,300 L296,300 L296,204 L328,204" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M440,230 L440,278" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-fail)"/>
<rect x="332.0" y="281.0" width="216" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="440.0" y="301.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Refused before it starts</text>
<text x="440.0" y="334.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the reason names the variable,</text>
<text x="440.0" y="353.0" font-size="14" fill="#8ca5b2" text-anchor="middle">never its value</text>
<rect x="610" y="70" width="318" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="769.0" y="95.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Said or sent as written</text>
<text x="769.0" y="115.0" font-size="14" fill="#8ca5b2" text-anchor="middle">greeting, workflow lines and SMS</text>
<text x="769.0" y="134.0" font-size="14" fill="#8ca5b2" text-anchor="middle">with the values filled in</text>
<rect x="610" y="230" width="318" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="769.0" y="255.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Instructions name it only</text>
<text x="769.0" y="275.0" font-size="14" fill="#8ca5b2" text-anchor="middle">{{balance}} reads as balance;</text>
<text x="769.0" y="294.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the values reach the model as data</text>
<path d="M550,176 L580,176 L580,110 L608,110" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M550,204 L580,204 L580,270 L608,270" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<text x="480.0" y="398.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Declare a variable once, write it into the agent's lines, and give each call its own values.</text>
<text x="480.0" y="418.0" font-size="14" fill="#8ca5b2" text-anchor="middle">A call whose values are missing or wrong is refused before it starts, not cut short.</text>
</svg>
