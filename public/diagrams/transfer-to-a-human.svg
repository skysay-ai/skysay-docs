<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Transfer to a human: from the caller's request to the three ways a ringing transfer ends" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Transfer to a human: from the caller's request to the three ways a ringing transfer ends</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker>
<marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="499" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="32" y="60" width="190" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="127.0" y="86.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Caller</text>
<text x="127.0" y="106.0" font-size="12.5" fill="#4b5563" text-anchor="middle">asks for a person, or</text>
<text x="127.0" y="123.0" font-size="12.5" fill="#4b5563" text-anchor="middle">says yes to an offer</text>
<rect x="266" y="60" width="190" height="76" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="361.0" y="86.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Your AI agent</text>
<text x="361.0" y="106.0" font-size="12.5" fill="#4b5563" text-anchor="middle">starts the transfer</text>
<text x="361.0" y="123.0" font-size="12" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">transfer_to_human</text>
<rect x="500" y="60" width="190" height="76" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="595.0" y="86.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Policy check</text>
<text x="595.0" y="106.0" font-size="12.5" fill="#4b5563" text-anchor="middle">is the destination</text>
<text x="595.0" y="123.0" font-size="12.5" fill="#4b5563" text-anchor="middle">allowed to be called?</text>
<rect x="734" y="60" width="194" height="76" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="831.0" y="86.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">Team phone rings</text>
<text x="831.0" y="106.0" font-size="12.5" fill="#4b5563" text-anchor="middle">your one configured number</text>
<text x="831.0" y="123.0" font-size="12.5" fill="#4b5563" text-anchor="middle">the AI stays with the caller</text>
<path d="M222,98.0 L264,98.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M456,98.0 L498,98.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M690,98.0 L732,98.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M595,136 L595,186" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<rect x="510.0" y="187.0" width="170" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.5"/>
<text x="595" y="206.5" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="600">Blocked: refused</text>
<path d="M746,136 V382" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<path d="M746,250 L758,250" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="755.0" y="235.0" width="190" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="850" y="254.5" font-size="13" fill="#2f6b4f" text-anchor="middle" font-weight="600">Answered</text>
<text x="736" y="247" font-size="12.5" fill="#4b5563" text-anchor="end">caller and person connected;</text>
<text x="736" y="264" font-size="12.5" fill="#4b5563" text-anchor="end">it can't be cancelled now</text>
<path d="M746,316 L758,316" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="755.0" y="301.0" width="190" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.5"/>
<text x="850" y="320.5" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="600">No answer, busy, declined</text>
<text x="736" y="313" font-size="12.5" fill="#4b5563" text-anchor="end">the caller stays with</text>
<text x="736" y="330" font-size="12.5" fill="#4b5563" text-anchor="end">the AI agent</text>
<path d="M746,382 L758,382" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="755.0" y="367.0" width="190" height="30" rx="15.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="850" y="386.5" font-size="13" fill="#374151" text-anchor="middle" font-weight="600">Caller says stop</text>
<text x="736" y="379" font-size="12.5" fill="#4b5563" text-anchor="end">ringing stops, nobody is</text>
<text x="736" y="396" font-size="12.5" fill="#4b5563" text-anchor="end">connected, the AI carries on</text>
<text x="32" y="210" font-size="12.5" fill="#6b7280" text-anchor="start">The caller's request is the confirmation:</text>
<text x="32" y="227" font-size="12.5" fill="#6b7280" text-anchor="start">no read-back, no second question.</text>
<text x="32" y="270" font-size="12.5" fill="#6b7280" text-anchor="start">One transfer attempt per call. After a</text>
<text x="32" y="287" font-size="12.5" fill="#6b7280" text-anchor="start">cancelled one, the AI offers a callback.</text>
<text x="480" y="462" font-size="14" fill="#4b5563" text-anchor="middle">Your AI agent transfers when the caller asks. Skysay checks the destination, then rings your team</text>
<text x="480" y="482" font-size="14" fill="#4b5563" text-anchor="middle">while the AI stays on the line. Only the caller can call it off, and only before anyone answers.</text>
</svg>
