<text x="28" y="404" font-size="14" fill="#4b5563">Starting a run freezes exactly what it tests, then plays every attempt with its own runner and checks your</text>
<text x="28" y="424" font-size="14" fill="#4b5563">rules in order. Each attempt ends pass, fail or error; an error could not be judged and never counts either way.</text>
