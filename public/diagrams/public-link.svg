<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Public link: a visitor talks to your hosted AI agent in the browser, and the conversation is a recorded call of your workspace" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>Public link: a visitor talks to your hosted AI agent in the browser, and the conversation is a recorded call of your workspace</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker>
<marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="409" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="60" width="170" height="110" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="117" y="98" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Visitor</text>
<text x="117" y="118" font-size="14" fill="#8ca5b2" text-anchor="middle">opens your link,</text>
<text x="117" y="135" font-size="14" fill="#8ca5b2" text-anchor="middle">presses Start talking</text>
<rect x="234" y="60" width="210" height="110" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="339" y="90" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Skysay checks</text>
<text x="339" y="110" font-size="14" fill="#8ca5b2" text-anchor="middle">the link is on,</text>
<text x="339" y="127" font-size="14" fill="#8ca5b2" text-anchor="middle">your balance covers it,</text>
<text x="339" y="144" font-size="14" fill="#8ca5b2" text-anchor="middle">visitor and link limits</text>
<rect x="476" y="60" width="210" height="110" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="581" y="98" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Your AI agent</text>
<text x="581" y="118" font-size="14" fill="#8ca5b2" text-anchor="middle">published setup, its tools</text>
<text x="581" y="135" font-size="14" fill="#8ca5b2" text-anchor="middle">talks up to 5 minutes</text>
<path d="M202,115 L232,115" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M444,115 L474,115" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M686,115 L716,115" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="718" y="100" width="212" height="30" rx="15" fill="#12302a" stroke="#5ad6a0" stroke-width="1.5"/>
<text x="824" y="119.5" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">A recorded call in Calls</text>
<text x="824" y="152" font-size="14" fill="#8ca5b2" text-anchor="middle">billed to your balance</text>
<path d="M339,170 L339,250" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#h-fail)"/>
<text x="349" y="214" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="600">a check refuses</text>
<rect x="219" y="252" width="240" height="30" rx="15" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="339" y="271.5" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="600">Not started, no call</text>
<text x="339" y="302" font-size="14" fill="#8ca5b2" text-anchor="middle">the page says busy or not available</text>
<text x="520" y="230" font-size="14" fill="#8492a8" text-anchor="start">Tools that need a phone line</text>
<text x="520" y="247" font-size="14" fill="#8492a8" text-anchor="start">(SMS, transfer, callback) don't</text>
<text x="520" y="264" font-size="14" fill="#8492a8" text-anchor="start">work in the browser.</text>
<text x="480" y="356" font-size="14" fill="#8ca5b2" text-anchor="middle">Anyone with the link talks to your hosted AI agent in the browser, with no account.</text>
<text x="480" y="376" font-size="14" fill="#8ca5b2" text-anchor="middle">Each conversation is an ordinary recorded call of your workspace, billed to your balance.</text>
</svg>
