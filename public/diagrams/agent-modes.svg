<text x="566.0" y="58" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">external_text</text>
<text x="816.0" y="40" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Realtime audio agent</text>
<text x="816.0" y="58" font-size="12" fill="#8ca5b2" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">external_audio</text>
<text x="24" y="107" font-size="13.5" fill="#dbe4f0" font-weight="600">Hears the caller</text>
<text x="24" y="167" font-size="13.5" fill="#dbe4f0" font-weight="600">Decides what to say</text>
<text x="24" y="227" font-size="13.5" fill="#dbe4f0" font-weight="600">Speaks</text>
<rect x="196" y="76" width="240" height="52" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="316.0" y="98.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Skysay</text>
<text x="316.0" y="115.5" font-size="12" fill="#8ca5b2" text-anchor="middle">speech-to-text</text>
<rect x="196" y="136" width="240" height="52" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="316.0" y="158.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Skysay</text>
<text x="316.0" y="175.5" font-size="12" fill="#8ca5b2" text-anchor="middle">your prompt, a model you choose</text>
<rect x="196" y="196" width="240" height="52" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="316.0" y="218.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Skysay</text>
<text x="316.0" y="235.5" font-size="12" fill="#8ca5b2" text-anchor="middle">text-to-speech, your chosen voice</text>
<rect x="446" y="76" width="240" height="52" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="566.0" y="98.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Skysay</text>
<text x="566.0" y="115.5" font-size="12" fill="#8ca5b2" text-anchor="middle">speech-to-text</text>
<rect x="446" y="136" width="240" height="52" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="566.0" y="158.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Your app</text>
<text x="566.0" y="175.5" font-size="12" fill="#8ca5b2" text-anchor="middle">text in, words to say back</text>
<rect x="446" y="196" width="240" height="52" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="566.0" y="218.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Skysay</text>
<text x="566.0" y="235.5" font-size="12" fill="#8ca5b2" text-anchor="middle">speaks your words</text>
<rect x="696" y="76" width="240" height="172" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="816.0" y="141.5" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Your app</text>
<text x="816.0" y="158.5" font-size="12" fill="#8ca5b2" text-anchor="middle">hears and speaks the call</text>
<text x="816.0" y="175.5" font-size="12" fill="#8ca5b2" text-anchor="middle">itself, over the signed</text>
<text x="816.0" y="192.5" font-size="12" fill="#8ca5b2" text-anchor="middle">audio stream</text>
<text x="24" y="296" font-size="13.5" fill="#dbe4f0" font-weight="600">Phone calls</text>
<rect x="226" y="278" width="180" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="316.0" y="297.5" font-size="13" fill="#5ad6a0" font-weight="600" text-anchor="middle">Yes</text>
<rect x="476" y="278" width="180" height="30" rx="15.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="566.0" y="297.5" font-size="13" fill="#ff6b6b" font-weight="600" text-anchor="middle">Not yet</text>
<rect x="726" y="278" width="180" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="816.0" y="297.5" font-size="13" fill="#5ad6a0" font-weight="600" text-anchor="middle">Yes</text>
<text x="316" y="326" font-size="11.5" fill="#8ca5b2" text-anchor="middle">or GPT-Live 1 hears and</text>
<text x="316" y="341" font-size="11.5" fill="#8ca5b2" text-anchor="middle">speaks in one engine</text>
<text x="566" y="326" font-size="11.5" fill="#ff6b6b" text-anchor="middle">calls are refused before</text>
<text x="566" y="341" font-size="11.5" fill="#ff6b6b" text-anchor="middle">dialling; events still arrive</text>
<text x="816" y="326" font-size="11.5" fill="#8ca5b2" text-anchor="middle">Skysay numbers and your</text>
<text x="816" y="341" font-size="11.5" fill="#8ca5b2" text-anchor="middle">own SIP trunk</text>
<text x="28" y="410" font-size="14" fill="#8ca5b2">An agent&#x27;s mode decides who hears the caller, who decides what to say and who speaks. Hosted and realtime</text>
<text x="28" y="430" font-size="14" fill="#8ca5b2">audio agents take phone calls; a webhook agent can&#x27;t take them yet.</text>
