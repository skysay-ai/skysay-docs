<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ff6b6b"/></marker><marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#ff6b6b"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#37c9d8"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#37c9d8"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8492a8"/></marker><marker id="ass" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 z" fill="#8492a8"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="418.5" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="24" y="70" width="200" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="124.0" y="100.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Call ends</text>
<text x="124.0" y="117.5" font-size="14" fill="#8ca5b2" text-anchor="middle">status, ending reason,</text>
<text x="124.0" y="135.0" font-size="14" fill="#8ca5b2" text-anchor="middle">duration: platform facts</text>
<rect x="256" y="70" width="210" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="361.0" y="100.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Recording, transcript</text>
<text x="361.0" y="117.5" font-size="14" fill="#8ca5b2" text-anchor="middle">stored, usually in moments;</text>
<text x="361.0" y="135.0" font-size="14" fill="#8ca5b2" text-anchor="middle">retries for ~5 h if it fails</text>
<path d="M224,112 L254,112" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="510" y="24" width="214" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="617.0" y="54.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">AI call summary</text>
<text x="617.0" y="71.5" font-size="14" fill="#8ca5b2" text-anchor="middle">free, on for every agent;</text>
<text x="617.0" y="89.0" font-size="14" fill="#8ca5b2" text-anchor="middle">summary, goal met, follow-up</text>
<rect x="510" y="132" width="214" height="84" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="617.0" y="162.0" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Result fields</text>
<text x="617.0" y="179.5" font-size="14" fill="#8ca5b2" text-anchor="middle">only if you set them;</text>
<text x="617.0" y="197.0" font-size="14" fill="#8ca5b2" text-anchor="middle">your fields, from the call</text>
<path d="M466,112 L488,112 L488,66 L508,66" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<path d="M488,112 L488,174 L508,174" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="732" y="52" font-size="14" fill="#8ca5b2">No webhook. Read it on</text>
<text x="732" y="70" font-size="14" fill="#8ca5b2">Calls, or with</text>
<text x="732" y="88" font-size="14" fill="#8ca5b2" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">GET /v1/calls/{id}/summary</text>
<rect x="58" y="172" width="132" height="24" rx="6" fill="#1a2536" stroke="#2c3a52" stroke-width="1"/>
<text x="124" y="188.5" font-size="14" fill="#dbe4f0" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">call.completed</text>
<rect x="70.5" y="202" width="107" height="24" rx="6" fill="#1a2536" stroke="#2c3a52" stroke-width="1"/>
<text x="124" y="218.5" font-size="14" fill="#dbe4f0" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">call.failed</text>
<rect x="270" y="172" width="182" height="24" rx="6" fill="#1a2536" stroke="#2c3a52" stroke-width="1"/>
<text x="361" y="188.5" font-size="14" fill="#dbe4f0" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">call.recording.ready</text>
<rect x="265.5" y="202" width="191" height="24" rx="6" fill="#1a2536" stroke="#2c3a52" stroke-width="1"/>
<text x="361" y="218.5" font-size="14" fill="#dbe4f0" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">call.transcript.ready</text>
<rect x="740.5" y="162" width="191" height="24" rx="6" fill="#1a2536" stroke="#2c3a52" stroke-width="1"/>
<text x="836" y="178.5" font-size="14" fill="#dbe4f0" text-anchor="middle" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace">call.extraction.ready</text>
<path d="M724,174 L740,174" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="24" y="278" width="912" height="52" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="480.0" y="300.75" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Your webhook endpoint</text>
<text x="480.0" y="318.25" font-size="14" fill="#8ca5b2" text-anchor="middle">the events you subscribe to, signed, at least once and in any order</text>
<path d="M124,226 L124,276" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<path d="M361,226 L361,276" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<path d="M836,186 L836,276" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="28" y="364" font-size="14" fill="#8ca5b2">A completed call sends its facts first, then its recording and transcript; a failed call stops at its facts. The</text>
<text x="28" y="384" font-size="14" fill="#8ca5b2">AI summary and your result fields are written from the transcript: AI estimates that Skysay never acts on.</text>
</svg>
