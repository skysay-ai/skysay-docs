<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">When a caller's turn ends</title><desc id="d">After the caller stops talking, voice activity confirms silence after about 0.25 seconds, the hold runs 0.6 seconds in a turn-model language or 0.8 seconds in other languages on the default preset, and the final transcript arrives when the speech-to-text provider sends it. The turn ends at the latest of these; the model and voice then need their own time.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3f7a5e"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="429" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="268" y="56" width="90.0" height="26" rx="6" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.4"/>
<text x="24.0" y="66.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">Voice activity hears</text>
<text x="24.0" y="82.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">the end of speech</text>
<text x="366.0" y="74.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">about 0.25 s</text>
<rect x="268" y="104" width="216.0" height="26" rx="6" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.4"/>
<text x="24.0" y="114.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">Hold, turn-model</text>
<text x="24.0" y="130.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">language (finished)</text>
<text x="492.0" y="122.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">0.6 s</text>
<rect x="268" y="152" width="288.0" height="26" rx="6" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.4"/>
<text x="24.0" y="162.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">Hold, every other</text>
<text x="24.0" y="178.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">language</text>
<text x="564.0" y="170.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">0.8 s</text>
<rect x="268" y="200" width="360.0" height="26" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="24.0" y="218.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">Final transcript</text>
<text x="636.0" y="218.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">when the provider sends it (example)</text>
<line x1="628.0" y1="44" x2="628.0" y2="300" stroke="#3f7a5e" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="628.0" y="36.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#2f6b4f" text-anchor="middle">Turn ends: the latest of these</text>
<rect x="628.0" y="256" width="162.0" height="26" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
<text x="24.0" y="266.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">Model and voice</text>
<text x="24.0" y="282.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start">prepare the reply</text>
<rect x="800.0" y="254" width="129.4" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="864.7" y="273.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">Caller hears it</text>
<line x1="268" y1="316" x2="826.0" y2="316" stroke="#9ca3af" stroke-width="1"/>
<line x1="268.0" y1="316" x2="268.0" y2="321" stroke="#9ca3af" stroke-width="1"/>
<text x="268.0" y="335.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">0 s</text>
<line x1="448.0" y1="316" x2="448.0" y2="321" stroke="#9ca3af" stroke-width="1"/>
<text x="448.0" y="335.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">0.5 s</text>
<line x1="628.0" y1="316" x2="628.0" y2="321" stroke="#9ca3af" stroke-width="1"/>
<text x="628.0" y="335.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">1 s</text>
<line x1="808.0" y1="316" x2="808.0" y2="321" stroke="#9ca3af" stroke-width="1"/>
<text x="808.0" y="335.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">1.5 s</text>
<text x="24.0" y="320.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Caller stops talking at 0 s</text>
<line x1="24" y1="362" x2="936" y2="362" stroke="#eef0f3" stroke-width="1"/>
<text x="24.0" y="388.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">The hold is the shortest wait before a turn can end, not the reply time. Hold values are the default balanced preset on a phone</text>
<text x="24.0" y="408.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">call; the transcript time varies by speech-to-text provider.</text>
</svg>
