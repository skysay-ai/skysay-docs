<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-labelledby="t d"><title id="t">How the agent ends a call with end_call</title><desc id="d">The agent asks to end the call, its goodbye plays, and the call ends with agent_completed unless the caller speaks again first. If they do, the hang-up is cancelled and the conversation continues; a later ending needs a new end_call.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#37c9d8"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8492a8"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="391" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="30" y="64" width="200" height="80" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="130.0" y="89.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Agent asks to end</text>
<text x="130.0" y="110.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">It calls end_call when the</text>
<text x="130.0" y="127.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">caller is done</text>
<rect x="262" y="64" width="222" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="373.0" y="89.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Goodbye plays</text>
<text x="373.0" y="110.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Standard: Skysay speaks it.</text>
<text x="373.0" y="127.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Live engines: the model's own.</text>
<rect x="516" y="64" width="170" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="601.0" y="99.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Caller speaks</text>
<text x="601.0" y="118.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">again?</text>
<path d="M230.0 104.0 L260.0 104.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M484.0 104.0 L514.0 104.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M686.0 104.0 L716.0 104.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<text x="701.0" y="96.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8492a8" text-anchor="middle">No</text>
<rect x="718.0" y="89.0" width="222" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.3"/>
<text x="731.0" y="108.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#5ad6a0" text-anchor="start">Call ends</text>
<text x="801.0" y="108.2" font-family="'JetBrains Mono Variable', ui-monospace, Menlo, monospace" font-size="14" font-weight="500" fill="#5ad6a0" text-anchor="start">agent_completed</text>
<text x="373.0" y="166.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8492a8" text-anchor="middle">Bounded: after about 15 s it ends anyway</text>
<path d="M601.0 144.0 L601.0 222.0" fill="none" stroke="#8492a8" stroke-width="1.6" marker-end="url(#aSec)" stroke-linejoin="round"/>
<text x="609.0" y="190.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8492a8" text-anchor="start">Yes</text>
<rect x="476" y="224" width="250" height="72" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="601.0" y="245.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Hang-up cancelled</text>
<text x="601.0" y="266.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">The agent answers them; a later</text>
<text x="601.0" y="283.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">ending needs a new end_call</text>
<path d="M476.0 260.0 L130.0 260.0 L130.0 146.0" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aSec)" stroke-linejoin="round"/>
<text x="300.0" y="252.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8492a8" text-anchor="middle">later</text>
<line x1="24" y1="324" x2="936" y2="324" stroke="#1e2a3d" stroke-width="1"/>
<text x="24.0" y="350.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">An end_call request is a proposal, not a finished hang-up: if the caller starts speaking before the close, the call stays open.</text>
<text x="24.0" y="370.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">The agent is instructed to end only after a goodbye, when nothing else is needed, or when the wrong person answered.</text>
</svg>
