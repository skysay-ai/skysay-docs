<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="ass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker><marker id="afs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="150" width="200" height="84" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="132.0" y="180.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Agent reads it back</text>
<text x="132.0" y="199.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">what, when and who,</text>
<text x="132.0" y="216.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">one yes-or-no question</text>
<rect x="280" y="150" width="200" height="84" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="380.0" y="180.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Caller answers</text>
<text x="380.0" y="199.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">counted only after the</text>
<text x="380.0" y="216.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">read-back has finished</text>
<polyline points="232,192 278,192" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="132" y="256" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8492a8" text-anchor="middle">about 8 seconds at most</text>
<text x="380" y="256" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8492a8" text-anchor="middle">Talked over? It is not heard,</text>
<text x="380" y="272" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8492a8" text-anchor="middle">and the agent reads it again.</text>
<rect x="560" y="52" width="172" height="44" rx="8" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="646.0" y="79.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Clear, explicit yes</text>
<rect x="560" y="142" width="172" height="44" rx="8" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="646.0" y="169.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Changes the details</text>
<rect x="560" y="232" width="172" height="44" rx="8" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="646.0" y="259.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Unclear</text>
<rect x="560" y="322" width="172" height="44" rx="8" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="646.0" y="349.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">No, silence, hang-up</text>
<polyline points="482,192 558,74" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="482,192 558,164" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<polyline points="482,192 558,254" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<polyline points="482,192 558,344" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<polyline points="732,74 758,74" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<rect x="760" y="57" width="176" height="34" rx="17.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.4"/>
<text x="848.0" y="78.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5ad6a0" font-weight="600" text-anchor="middle">Action runs once</text>
<polyline points="732,164 758,164" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<rect x="760" y="147" width="176" height="34" rx="17.0" fill="#1a2536" stroke="#5b6b84" stroke-width="1.4"/>
<text x="848.0" y="168.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">New read-back</text>
<text x="848" y="199" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8492a8" text-anchor="middle">and a new yes</text>
<polyline points="732,254 758,254" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<rect x="760" y="230" width="176" height="48" rx="17" fill="#1a2536" stroke="#5b6b84" stroke-width="1.4"/>
<text x="848.0" y="250.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dbe4f0" font-weight="600" text-anchor="middle">Asks once more</text>
<text x="848.0" y="266.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ff6b6b" text-anchor="middle">unclear again: cancelled</text>
<polyline points="732,344 758,344" fill="none" stroke="#ff6b6b" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#af)"/>
<rect x="760" y="327" width="176" height="34" rx="17.0" fill="#2a1618" stroke="#ff6b6b" stroke-width="1.4"/>
<text x="848.0" y="348.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ff6b6b" font-weight="600" text-anchor="middle">Does not run</text>
<text x="480.0" y="410" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">A booking, SMS or similar change runs only after a later, explicit yes to its exact details.</text>
<text x="480.0" y="430" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">Changing the details starts a new read-back. No, silence or hanging up never approves it.</text>
</svg>
