<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker><marker id="ams" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a5e"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="afs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="619" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="40" y="26" width="190" height="62" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="135.0" y="53.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Your hosted agent</text>
<text x="135.0" y="72.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">on the call</text>
<rect x="280" y="26" width="190" height="62" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="375.0" y="53.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Skysay</text>
<text x="375.0" y="72.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">signs and checks</text>
<rect x="520" y="26" width="190" height="62" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="615.0" y="53.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Your adapter</text>
<text x="615.0" y="72.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">your HTTPS endpoint</text>
<rect x="740" y="26" width="190" height="62" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="835.0" y="53.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Your CRM or billing</text>
<text x="835.0" y="72.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">system of record</text>
<polyline points="135,88 135,540" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
<polyline points="375,88 375,540" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
<polyline points="615,88 615,462" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
<polyline points="835,88 835,462" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
<polyline points="135,132 373,132" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="255" y="123" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151" text-anchor="middle">uses an attached read Action</text>
<polyline points="375,182 613,182" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="495" y="173" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151" text-anchor="middle">signed JSON request</text>
<text x="495" y="199" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">with call, agent and case references</text>
<rect x="510" y="216" width="210" height="62" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="615.0" y="243.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Verifies the signature</text>
<text x="615.0" y="262.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">then checks its own rules</text>
<polyline points="615,312 833,312" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="725" y="303" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151" text-anchor="middle">reads the current fact</text>
<polyline points="835,350 617,350" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="725" y="341" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">data</text>
<polyline points="615,392 377,392" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="495" y="383" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">small, safe answer</text>
<text x="495" y="409" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">matching the Action's output schema</text>
<rect x="280" y="422" width="190" height="62" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="375.0" y="449.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="middle">Checks the answer</text>
<text x="375.0" y="468.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">shape and size</text>
<polyline points="375,512 137,512" fill="none" stroke="#3f7a5e" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="255" y="503" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151" text-anchor="middle">checked result</text>
<polyline points="470,453 690,453 690,488" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="520" y="488" width="340" height="50" rx="17" fill="#fdebe3" stroke="#c2410c" stroke-width="1.4"/>
<text x="690.0" y="509.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">Timeout, error or wrong shape:</text>
<text x="690.0" y="525.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle">a failed result, never a blank or zero answer</text>
<text x="480.0" y="570" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">The model can supply only the Action's declared arguments. Skysay adds the call references, signs the request,</text>
<text x="480.0" y="590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">and returns your adapter's answer to the agent only if it matches the output schema and fits in 64 KiB.</text>
</svg>
