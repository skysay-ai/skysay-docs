<svg xmlns="http://www.w3.org/2000/svg" width="960" height="532" viewBox="0 0 960 532" role="img" aria-labelledby="t d"><title id="t">How a call chooses its response language</title><desc id="d">The call opens in its opening language. A Standard agent either keeps one language or follows the caller, switching only to a published language; a request for an unpublished language is refused. GPT-Live 1 and Gemini Live follow the caller inside the model, best effort, with no language lock.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3f7a5e"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="531" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="330" y="28" width="300" height="64" rx="10" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.5"/>
<text x="480.0" y="54.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Call opens in the opening language</text>
<text x="480.0" y="75.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Then the caller speaks</text>
<rect x="20" y="128" width="610" height="316" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="146.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#6b7280" text-anchor="start">Standard</text>
<rect x="646" y="128" width="294" height="316" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="658.0" y="146.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#6b7280" text-anchor="start">GPT-Live 1 and Gemini Live</text>
<rect x="40" y="160" width="272" height="80" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="176.0" y="194.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Single language per call</text>
<text x="176.0" y="215.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Keeps the call's language profile</text>
<rect x="338" y="160" width="272" height="80" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="474.0" y="185.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Follow the caller</text>
<text x="474.0" y="206.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">On by default with 2+ languages;</text>
<text x="474.0" y="223.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">switches only within the published set</text>
<rect x="664" y="160" width="258" height="80" rx="10" fill="#e8edfb" stroke="#4c63d2" stroke-width="1.5"/>
<text x="793.0" y="185.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">The model follows</text>
<text x="793.0" y="206.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Told to follow a full sentence or a</text>
<text x="793.0" y="223.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">request; no language lock</text>
<path d="M480.0 92.0 L480.0 112.0 L176.0 112.0 L176.0 158.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M480.0 112.0 L474.0 112.0 L474.0 158.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M480.0 112.0 L880.0 112.0 L880.0 158.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M176.0 240.0 L176.0 274.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="90.7" y="276" width="170.7" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="176.0" y="295.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">Stays in one language</text>
<text x="176.0" y="330.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">A caller who changes language gets no</text>
<text x="176.0" y="346.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">controlled switch</text>
<path d="M420.0 240.0 L420.0 274.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="346.0" y="276" width="246.5" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="469.2" y="295.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">Switches to a published language</text>
<text x="346.0" y="326.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">On a clear request, or when the</text>
<text x="346.0" y="342.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">transcriber reports it twice in a row</text>
<path d="M600.0 240.0 L600.0 368.0" fill="none" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#aFail)" stroke-linejoin="round"/>
<rect x="388.2" y="370" width="225.8" height="30" rx="15.0" fill="#fdebe3" stroke="#c2410c" stroke-width="1.3"/>
<text x="501.1" y="389.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">Unpublished language: refused</text>
<text x="612.0" y="418.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="end">The agent names the languages it can use</text>
<path d="M793.0 240.0 L793.0 274.0" fill="none" stroke="#3f7a5e" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="673.2" y="276" width="239.6" height="30" rx="15.0" fill="#e6f2ec" stroke="#3f7a5e" stroke-width="1.3"/>
<text x="793.0" y="295.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f6b4f" text-anchor="middle">Follows the caller, best effort</text>
<text x="793.0" y="330.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Instructions can be missed, for</text>
<text x="793.0" y="346.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">example by a recording on the line</text>
<line x1="24" y1="464" x2="936" y2="464" stroke="#eef0f3" stroke-width="1"/>
<text x="24.0" y="490.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">A Standard agent keeps one language, or switches only within the languages you published. GPT-Live 1 and Gemini Live follow the</text>
<text x="24.0" y="510.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">caller inside the model with no lock. Unclear speech can be misheard on any path.</text>
</svg>
