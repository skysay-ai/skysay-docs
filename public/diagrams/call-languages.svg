<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
  <title id="title">How Skysay chooses the call language</title>
  <desc id="desc">After the opening, Standard agents either keep one language or switch within the published set. GPT Live and Gemini Live follow the caller inside the model, with no equivalent controlled allowlist. Recognition and model mistakes remain possible.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #152e3c; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 17px; }
      .muted { fill: #486171; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="690" rx="18" fill="#f6f9fa"/>
  <text x="32" y="43" class="heading">One opening language. Different switching controls.</text>
  <text x="32" y="72" class="body muted">Website translations and the demo menu do not define the conversation policy.</text>
  <rect x="335" y="100" width="370" height="68" rx="12" fill="#e2f3f3" stroke="#92c9cc"/>
  <text x="520" y="127" text-anchor="middle" class="label">Call opens in the chosen language</text>
  <text x="520" y="151" text-anchor="middle" class="body">Then the caller speaks</text>
  <path d="M520 168 V188 H350 V211" class="line"/>
  <path d="M520 188 H845 V211" class="line"/>
  <rect x="32" y="216" width="640" height="60" rx="12" fill="#e2f3f3" stroke="#92c9cc"/>
  <text x="352" y="242" text-anchor="middle" class="label">Standard: STT → language model → TTS</text>
  <text x="352" y="265" text-anchor="middle" class="body">Published profiles define permitted switches</text>
  <rect x="696" y="216" width="312" height="60" rx="12" fill="#eeebfb" stroke="#beb2e3"/>
  <text x="852" y="242" text-anchor="middle" class="label">GPT Live / Gemini Live</text>
  <text x="852" y="265" text-anchor="middle" class="body">The model handles speech</text>
  <path d="M352 276 V296 H188 V322" class="line"/>
  <path d="M352 296 H516 V322" class="line"/>
  <path d="M852 276 V322" class="line"/>
  <rect x="32" y="327" width="312" height="250" rx="12" fill="#fff" stroke="#ccd9df"/>
  <text x="52" y="361" class="label">Single language per call</text>
  <text x="52" y="397" class="body"><tspan x="52">Keep the selected profile.</tspan><tspan x="52" dy="28">Instruct the agent to answer</tspan><tspan x="52" dy="24">in that language.</tspan><tspan x="52" dy="40">No controlled switch when</tspan><tspan x="52" dy="24">the caller changes language.</tspan></text>
  <rect x="360" y="327" width="312" height="250" rx="12" fill="#fff" stroke="#ccd9df"/>
  <text x="380" y="361" class="label">Auto multilingual / Follow</text>
  <text x="380" y="397" class="body"><tspan x="380">Clear request; phone/workspace</tspan><tspan x="380" dy="24">tests can also use detection.</tspan><tspan x="380" dy="36">Allowed → switch profile.</tspan><tspan x="380" dy="34">Excluded request → refuse</tspan><tspan x="380" dy="24">in the current language;</tspan><tspan x="380" dy="24">offer available languages.</tspan></text>
  <rect x="696" y="327" width="312" height="250" rx="12" fill="#fff" stroke="#beb2e3"/>
  <text x="716" y="361" class="label">Native language following</text>
  <text x="716" y="397" class="body"><tspan x="716">Full sentence in another</tspan><tspan x="716" dy="24">language, or a request.</tspan><tspan x="716" dy="36">Model is instructed to follow.</tspan><tspan x="716" dy="34">Best effort. No equivalent</tspan><tspan x="716" dy="24">controlled language lock</tspan><tspan x="716" dy="24">or selected-language list.</tspan></text>
  <rect x="32" y="600" width="976" height="66" rx="12" fill="#fff4dd" stroke="#dfc589"/>
  <text x="52" y="627" class="body"><tspan font-weight="700">Across all paths:</tspan> unclear or unfamiliar speech may be misrecognized.</text>
  <text x="52" y="651" class="body">Understanding a request ≠ permission to switch. Model instructions ≠ guaranteed spoken output.</text>
</svg>
