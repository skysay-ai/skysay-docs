<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">The first seconds of an outbound call</title><desc id="d">While the call rings the agent hears nothing. Once it is answered Skysay listens: if the person speaks, the agent replies after they finish; after 2 seconds of silence it says its first message; after 6 seconds of music or a tone it says its first message once.</desc><defs><marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#37c9d8"/></marker><marker id="aSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8492a8"/></marker><marker id="aFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="409" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="24" y="150" width="160" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="104.0" y="175.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Ringing</text>
<text x="104.0" y="196.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Your agent hears and</text>
<text x="104.0" y="213.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">says nothing</text>
<rect x="212" y="150" width="164" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="294.0" y="175.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Call answered</text>
<text x="294.0" y="196.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Skysay listens for</text>
<text x="294.0" y="213.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">the person</text>
<path d="M184.0 190.0 L210.0 190.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="424" y="54" width="252" height="72" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="550.0" y="75.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">The person speaks</text>
<text x="550.0" y="96.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Waits until they finish: a pause of</text>
<text x="550.0" y="113.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">about 0.6 s</text>
<path d="M376.0 190.0 L400.0 190.0 L400.0 90.0 L422.0 90.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M676.0 90.0 L712.0 90.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="714.0" y="75" width="198.2" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.3"/>
<text x="813.1" y="94.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#5ad6a0" text-anchor="middle">Replies to what they said</text>
<rect x="424" y="154" width="252" height="72" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="550.0" y="175.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Nobody speaks</text>
<text x="550.0" y="196.6" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">2 seconds of silence by default</text>
<text x="550.0" y="213.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">(you can set 1 to 5)</text>
<path d="M376.0 190.0 L400.0 190.0 L400.0 190.0 L422.0 190.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M676.0 190.0 L712.0 190.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="714.0" y="175" width="177.6" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.3"/>
<text x="802.8" y="194.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#5ad6a0" text-anchor="middle">Says the First message</text>
<rect x="424" y="254" width="252" height="72" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="550.0" y="284.1" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f0" text-anchor="middle">Music or a tone, no voice</text>
<text x="550.0" y="305.1" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="middle">Not silence: waits 6 seconds of it</text>
<path d="M376.0 190.0 L400.0 190.0 L400.0 290.0 L422.0 290.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<path d="M676.0 290.0 L712.0 290.0" fill="none" stroke="#37c9d8" stroke-width="2.2" marker-end="url(#aMain)" stroke-linejoin="round"/>
<rect x="714.0" y="275" width="212.0" height="30" rx="15.0" fill="#14262b" stroke="#37c9d8" stroke-width="1.3"/>
<text x="820.0" y="294.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#5ad6a0" text-anchor="middle">Says the First message once</text>
<line x1="24" y1="342" x2="936" y2="342" stroke="#1e2a3d" stroke-width="1"/>
<text x="24.0" y="368.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">With the default Wait for the person, the agent lets whoever answers say hello first. Voicemail boxes and phone menus are</text>
<text x="24.0" y="388.0" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8ca5b2" text-anchor="start">recognised separately; inbound calls and browser tests open with the agent speaking.</text>
</svg>
