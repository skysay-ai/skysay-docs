<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" role="img">
  <title>From an answered inbound call to a Zendesk ticket</title>
  <defs><marker id="zendesk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="387" rx="12" fill="#141d2c" stroke="#243049"/>
  <text x="30" y="34" font-family="'Geist Variable', system-ui, sans-serif" font-size="16" font-weight="600" fill="#dbe4f0">One connected project. One selected inbound AI agent.</text>
  <text x="30" y="59" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">A workspace administrator connects Zendesk before any ticket delivery.</text>
  <rect x="30" y="92" width="230" height="106" rx="12" fill="#16233a" stroke="#2b7fd6"/>
  <text x="145" y="122" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="16" font-weight="600" fill="#dbe4f0">Answered inbound call</text>
  <text x="145" y="148" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">Your selected hosted agent</text>
  <text x="145" y="172" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">finishes the conversation</text>
  <path d="M260 145 H332" fill="none" stroke="#37c9d8" stroke-width="2" marker-end="url(#zendesk-arrow)"/>
  <rect x="340" y="92" width="230" height="106" rx="12" fill="#14262b" stroke="#37c9d8"/>
  <text x="455" y="122" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="16" font-weight="600" fill="#dbe4f0">Skysay prepares the note</text>
  <text x="455" y="148" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">Summary + outcome + call link</text>
  <text x="455" y="172" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">No recording or full transcript</text>
  <path d="M570 145 H632" fill="none" stroke="#37c9d8" stroke-width="2" marker-end="url(#zendesk-arrow)"/>
  <rect x="640" y="92" width="230" height="106" rx="12" fill="#1a2536" stroke="#2c3a52"/>
  <text x="755" y="122" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="16" font-weight="600" fill="#dbe4f0">New Zendesk ticket</text>
  <text x="755" y="148" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">Internal note, not a public reply</text>
  <text x="755" y="172" text-anchor="middle" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">Open it from Recent deliveries</text>
  <rect x="30" y="226" width="410" height="64" rx="12" fill="#2a1618" stroke="#ff6b6b"/>
  <text x="48" y="251" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" font-weight="600" fill="#ff6b6b">Excluded: failed or unanswered calls</text>
  <text x="48" y="274" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#ff6b6b">Also excluded: outbound, simulation and past calls</text>
  <rect x="460" y="226" width="410" height="64" rx="12" fill="#1a2536" stroke="#2c3a52"/>
  <text x="478" y="251" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" font-weight="600" fill="#dbe4f0">Unconfirmed delivery?</text>
  <text x="478" y="274" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">Check Zendesk before creating a replacement ticket.</text>
  <text x="30" y="331" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">If the summary is not ready after two minutes, the note contains the outcome and call link.</text>
  <text x="30" y="356" font-family="'Geist Variable', system-ui, sans-serif" font-size="14" fill="#8ca5b2">The call link still requires Skysay access. Your Zendesk ticket rules and permissions still apply.</text>
</svg>
