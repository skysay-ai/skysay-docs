<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker></defs><rect x="0.5" y="0.5" width="959" height="369" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="30" y="84" width="200" height="66" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="130.0" y="113.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Prompt draft</text>
<text x="130.0" y="132.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">edits save, not live</text>
<rect x="280" y="84" width="200" height="66" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="380.0" y="113.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Review and publish</text>
<text x="380.0" y="132.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">compare, then confirm</text>
<rect x="530" y="84" width="180" height="66" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="620.0" y="113.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Live prompt</text>
<text x="620.0" y="132.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">used by calls</text>
<rect x="760" y="84" width="170" height="66" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="845.0" y="113.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Published versions</text>
<text x="845.0" y="132.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">read-only history</text>
<polyline points="230,117.0 278,117.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="480,117.0 528,117.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="710,117.0 758,117.0" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#am)"/>
<polyline points="845,84 845,46 130,46 130,82" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="487" y="36" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">New draft from a published version</text>
<rect x="515" y="214" width="210" height="62" rx="12" fill="#16233a" stroke="#2b7fd6" stroke-width="1.5"/>
<text x="620.0" y="241.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#dbe4f0" font-weight="600" text-anchor="middle">Your API or MCP client</text>
<text x="620.0" y="260.5" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">publishes a prompt</text>
<polyline points="620,214 620,152" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="634" y="187" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="start">read-only until you choose Save as draft</text>
<text x="480" y="318" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">Editing a draft never changes calls. In the workspace, a prompt goes live only when you review</text>
<text x="480" y="338" font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8ca5b2" text-anchor="middle">and publish it. Every published version stays in the history, where it can start a new draft.</text>
</svg>
