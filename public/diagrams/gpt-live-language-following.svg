<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="On GPT-Live 1 the opening is said as written, in the language it is written in. After that the agent is told to switch when a person speaks a full sentence in another language or asks it to, and not to switch for music, a recording, an announcement, background voices or unclear speech. These are instructions to the model, best effort and not a lock, so test each language you need." font-family="'Geist Variable', ui-sans-serif, system-ui, sans-serif">
<title>On GPT-Live 1 the opening is said as written, in the language it is written in. After that the agent is told to switch when a person speaks a full sentence in another language or asks it to, and not to switch for music, a recording, an announcement, background voices or unclear speech. These are instructions to the model, best effort and not a lock, so test each language you need.</title>
<defs>
<marker id="h-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37c9d8"/></marker><marker id="h-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8492a8"/></marker><marker id="h-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="379" rx="12" fill="#141d2c" stroke="#243049" stroke-width="1"/>
<rect x="32" y="120" width="200" height="80" rx="12" fill="#14262b" stroke="#37c9d8" stroke-width="1.5"/>
<text x="132.0" y="145.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The opening</text>
<text x="132.0" y="165.0" font-size="14" fill="#8ca5b2" text-anchor="middle">said exactly as written,</text>
<text x="132.0" y="184.0" font-size="14" fill="#8ca5b2" text-anchor="middle">in its own language</text>
<rect x="262" y="120" width="180" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="352.0" y="145.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">The far end</text>
<text x="352.0" y="165.0" font-size="14" fill="#8ca5b2" text-anchor="middle">speaks after</text>
<text x="352.0" y="184.0" font-size="14" fill="#8ca5b2" text-anchor="middle">the opening</text>
<path d="M232,160 L260,160" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="490" y="40" width="290" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="635.0" y="65.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">A person switches</text>
<text x="635.0" y="85.0" font-size="14" fill="#8ca5b2" text-anchor="middle">speaks a full sentence in another</text>
<text x="635.0" y="104.0" font-size="14" fill="#8ca5b2" text-anchor="middle">language, or asks the agent to</text>
<rect x="490" y="200" width="290" height="80" rx="12" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="635.0" y="225.0" font-size="15" fill="#dbe4f0" text-anchor="middle" font-weight="600">Anything else</text>
<text x="635.0" y="245.0" font-size="14" fill="#8ca5b2" text-anchor="middle">music, a recording, an announcement,</text>
<text x="635.0" y="264.0" font-size="14" fill="#8ca5b2" text-anchor="middle">background voices, unclear speech</text>
<path d="M442,160 L466,160 L466,80 L488,80" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<path d="M442,160 L466,160 L466,240 L488,240" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<path d="M780,80 L798,80" fill="none" stroke="#37c9d8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-main)"/>
<rect x="800.0" y="65.0" width="140" height="30" rx="15.0" fill="#12302a" stroke="#37c9d8" stroke-width="1.5"/>
<text x="870.0" y="85.0" font-size="14" fill="#5ad6a0" text-anchor="middle" font-weight="600">Agent switches</text>
<path d="M780,240 L798,240" fill="none" stroke="#8492a8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-sec)"/>
<rect x="800.0" y="225.0" width="140" height="30" rx="15.0" fill="#1a2536" stroke="#2c3a52" stroke-width="1.5"/>
<text x="870.0" y="245.0" font-size="14" fill="#dbe4f0" text-anchor="middle" font-weight="600">Agent stays</text>
<text x="480.0" y="338.0" font-size="14" fill="#8ca5b2" text-anchor="middle">GPT-Live 1 has no language setting: these are instructions to the model, best effort and not a lock.</text>
<text x="480.0" y="358.0" font-size="14" fill="#8ca5b2" text-anchor="middle">Test each language your business needs before real calls rely on it.</text>
</svg>
